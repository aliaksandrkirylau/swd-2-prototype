<!doctype html><html lang="pl"><head><title>SWD 2.0 Prototyp</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>SWD 2.0 Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototyp Systemu Wsparcia Diagnosty: portal diagnosty, wersja mobilna i panel administratora.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Open+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap&subset=latin-ext">
<style>
/* Layout concept: a bright clinical-editorial system — airy warm-white sheets, the Lab's "//" mark, the normal curve as the recurring image, coral for the single action that matters; each test family carries its own soft tint. Deliberately light-only. */
:root{
  color-scheme:light;
  --bg:#FCFBF9; --sunk:#F5F2EE; --sunk-2:#EFEBE6; --surface:#FFFFFF; --raise:#FFFFFF;
  --ink:#1C1917; --ink-2:#57514B; --ink-3:#8C857E; --line:#ECE7E1; --line-2:#DED7CF;
  --coral:#FB5642; --cta:#E4462F; --cta-h:#C93B29; --coral-ink:#C23A27; --coral-soft:#FFEFEA; --coral-2:#FF8E78; --peach:#FFF6F2; --stone:#BEB8B0;
  --ok:#24805A; --ok-soft:#E5F4EC; --warn:#A8660C; --warn-soft:#FDF1DD; --info:#2D64A0; --info-soft:#EAF1FA;
  --z-alarm:#FBDCD5; --z-low:#FCEBDA; --z-avg:#F1EDE8; --z-high:#DDF0E5; --z-rec:#E3EBF7; --pt-alarm:#D9412D;
  --cat-iq:#6A56CF; --cat-iq-bg:#F2EFFD; --cat-school:#2E70B6; --cat-school-bg:#EAF2FC; --cat-math:#23875C; --cat-math-bg:#E7F6EE;
  --cat-mem:#B5730A; --cat-mem-bg:#FDF3E0; --cat-emo:#C03E6D; --cat-emo-bg:#FCECF2; --cat-func:#1B8585; --cat-func-bg:#E5F5F5; --cat-ready:#86691A; --cat-ready-bg:#F7F2E2;
  --sc-ink:#4A433D; --sc-soft:#D7CEC4; --sc-cool:#7F8FC2;
  --sh-1:0 1px 2px rgba(28,25,23,.04),0 2px 6px rgba(28,25,23,.04);
  --sh-2:0 2px 4px rgba(28,25,23,.04),0 12px 32px -10px rgba(28,25,23,.14);
  --sh-3:0 4px 10px rgba(28,25,23,.05),0 28px 60px -20px rgba(28,25,23,.25);
  --f-display:"Sora","Open Sans",system-ui,sans-serif; --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; --r-md:12px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4,h5{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(1.8rem,1.15rem + 2.2vw,2.9rem);line-height:1.08;font-weight:600}
h2{font-size:clamp(1.3rem,1.1rem + .6vw,1.6rem);line-height:1.2;font-weight:600}h3{font-size:1.1rem;font-weight:600}h4{font-size:.95rem;font-weight:600}
p{margin:0}button{font:inherit;color:inherit}a{color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}.small{font-size:.82rem}.sp{flex:1}
.lead{font-size:1.08rem;color:var(--ink-2);line-height:1.6;max-width:60ch}
.eyebrow{display:block;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--ink-2);margin-bottom:14px}
.kicker.c i{width:9px;height:9px;border-radius:50%;background:var(--c)}.kicker.c{color:var(--c)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sl{color:var(--coral);font-family:var(--f-display);font-weight:700;margin-right:.45em;letter-spacing:-.08em}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem;cursor:pointer;transition:background .18s,border-color .18s,transform .12s,box-shadow .18s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3);box-shadow:var(--sh-1)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--cta);border-color:var(--cta);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -6px rgba(228,70,47,.55)}.btn.primary:hover{background:var(--cta-h);border-color:var(--cta-h)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}.btn.ghost:hover{background:var(--sunk)}
.btn.subtle{background:var(--sunk);border-color:transparent}.btn.subtle:hover{background:var(--sunk-2);box-shadow:none}
.btn.danger{background:var(--coral-ink);border-color:var(--coral-ink);color:#fff}
.btn.sm{min-height:34px;padding:0 13px;font-size:.82rem;gap:6px}.btn.lg{min-height:52px;font-size:1rem;padding:0 24px}.btn.block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}.icon-btn.sm{width:32px;height:32px}.icon-btn.xs{width:26px;height:26px}.icon-btn:disabled{opacity:.35;cursor:default}.icon-btn.danger:hover{color:var(--coral-ink);background:var(--coral-soft)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-align:left}.link.sm{font-size:.8rem}
.in{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:var(--stone)}.in:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}.in.err{border-color:var(--coral-ink);background-color:var(--coral-soft)}.in:disabled{background:var(--sunk);color:var(--ink-3)}
.in.sm{min-height:34px;padding:5px 10px;font-size:.85rem;border-radius:8px}textarea.in{resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.w-xs{width:64px;flex:none}.w-sm{width:120px;flex:none}.w-md{width:200px;flex:none}
.reveal{animation:rev .25s ease}@keyframes rev{from{opacity:0;transform:translateY(-4px)}}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}.seg.sm button{padding:4px 10px;font-size:.8rem;min-height:28px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);gap:2px;border:1px solid var(--line)}
.lang button{border:0;background:none;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--ink-3);cursor:pointer;min-height:26px}
.lang button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.tgl{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem;user-select:none}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}.tgl-t{width:38px;height:22px;border-radius:22px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tgl-t::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl input:checked+.tgl-t{background:var(--coral)}.tgl input:checked+.tgl-t::after{transform:translateX(16px)}.tgl input:focus-visible+.tgl-t{outline:2px solid var(--coral);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;font-size:.74rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-muted{background:var(--sunk);color:var(--ink-3)}.p-info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-3);white-space:nowrap}.tag.t-logic{background:var(--info-soft);color:var(--info)}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:42px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--ink-3)}.chip.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}.chip:disabled{opacity:.4;cursor:not-allowed}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}.chip-s.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.bar{height:6px;background:var(--sunk-2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--coral-2));border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}.bar.thin{height:4px;margin:-4px 0 22px}
.bar.ind i{width:40%;animation:ind 1.1s ease-in-out infinite}@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.scene{position:relative;overflow:hidden}.scene canvas{position:absolute;inset:0}

/* ---------- portal (container queries so the phone frame gets the real mobile layout) ---------- */
.swd{container:swd/inline-size;background:var(--bg);color:var(--ink);min-height:100%}
.site-h{background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
.util{background:var(--sunk);font-size:.78rem;color:var(--ink-2);border-bottom:1px solid var(--line)}.util-in{display:flex;align-items:center;gap:16px;min-height:36px}
.util-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.util-b{display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:5px 10px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:.78rem;font-weight:600}.util-b:hover{background:var(--surface);color:var(--ink)}
.proto-tag{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:600;letter-spacing:.02em}.proto-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px rgba(251,86,66,.18);animation:blink 2.4s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(251,86,66,.05)}}
.proto-tag.dark{color:var(--ink-2);background:var(--sunk);padding:6px 12px;border-radius:20px;align-self:flex-start}
.brand-row{display:flex;align-items:center;gap:18px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;padding:0;text-align:left;color:var(--ink)}
.brand-mk{display:grid;place-items:center;color:var(--ink)}.brand-t{display:flex;align-items:center;gap:12px}.brand-t b{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:-.05em;line-height:1}
.brand-t small{font-size:.56rem;line-height:1.25;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.brand.sm{gap:8px}.brand.sm b{font-family:var(--f-display);font-size:1.05rem}.brand.sm .mark{color:var(--coral)}
.brand-swd{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;color:var(--ink-2);transition:border-color .15s,box-shadow .15s}.brand-swd:hover{border-color:var(--coral);box-shadow:var(--sh-1)}
.swd-badge{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--coral-soft);color:var(--coral-ink)}
.burger-w{display:none;align-items:center;gap:6px;margin-left:auto}
.site-nav .nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.site-nav button{padding:11px 14px;font-size:.85rem;font-weight:600;border:0;background:none;color:var(--ink-2);white-space:nowrap;cursor:pointer;position:relative;border-radius:0}
.site-nav button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--coral);transform:scaleX(0);transition:transform .2s}
.site-nav button:hover{color:var(--ink)}.site-nav button.on{color:var(--ink)}.site-nav button.on::after{transform:scaleX(1)}
.main{padding-bottom:72px}
/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(80% 90% at 85% 20%,#FFE9E2 0%,rgba(255,233,226,0) 60%),radial-gradient(60% 70% at 10% 100%,#F2EFFD 0%,rgba(242,239,253,0) 60%),var(--bg);border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(28,25,23,.07) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,rgba(0,0,0,.6),transparent 85%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.6),transparent 85%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px 40px;align-items:center;padding-block:56px 48px}
.h-copy h1{font-size:clamp(2rem,1.2rem + 2.2vw,3.05rem)}.h-copy h1 em{font-style:normal;color:var(--coral-ink);display:block}
.h-copy .lead{margin-top:18px}
.h-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.h-stats{display:flex;gap:28px;margin:34px 0 0;flex-wrap:wrap}.h-stats div{display:flex;flex-direction:column}.h-stats dt{font-size:1.7rem;font-weight:700;color:var(--ink);line-height:1.1}.h-stats dd{margin:2px 0 0;font-size:.8rem;color:var(--ink-3);max-width:16ch}
.h-vis{position:relative;aspect-ratio:1.15;min-height:320px;max-width:100%}
.h-scene{position:absolute;inset:-6% -10% 8% -6%}
.h-scale{position:absolute;left:6%;right:6%;bottom:6%;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);border-top:1px dashed var(--line-2);padding-top:6px}.h-scale span.t{color:var(--coral-ink);font-weight:700}
.float{position:absolute;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--sh-2);display:flex;flex-direction:column;gap:2px;animation:floaty 7s ease-in-out infinite}
.float b{font-size:1.5rem;line-height:1.1}.fl-k{font-size:.72rem;color:var(--ink-3);font-weight:600}
.f1{top:6%;right:2%;animation-delay:-2s}.f1 .zt{margin-top:4px;align-self:flex-start}
.f2{left:0;top:42%;flex-direction:row;align-items:center;gap:10px;animation-delay:-4s}.f2 b{font-size:1rem}.f2>span:last-child{display:flex;flex-direction:column}
.ok-dot{width:30px;height:30px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.f3{right:10%;bottom:18%;animation-delay:-1s}.f3 b{font-size:1.2rem}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
/* how it works */
.how{display:flex;flex-direction:column;gap:14px;margin-top:-28px;position:relative;z-index:2}
.flow{list-style:none;margin:0;padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2)}
.flow li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);position:relative;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms)}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:1.5px;background:var(--line-2)}
.flow li>span:last-child{display:flex;flex-direction:column;line-height:1.3;min-width:0}.flow li b{font-size:.9rem}.flow li em{font-style:normal;font-size:.76rem;color:var(--ink-3)}
.flow li small{font-size:.68rem;color:var(--coral-ink);font-weight:700}
.flow-i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--coral-soft);color:var(--coral-ink);flex:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.warn-box{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid #F7D3CB;border-radius:var(--r-md);background:var(--peach);font-size:.88rem;color:var(--ink-2)}
.wb-i{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--coral-ink);display:grid;place-items:center;flex:none;box-shadow:var(--sh-1)}
.warn-box b{color:var(--ink)}.warn-box .ic{color:var(--coral-ink)}.warn-box.sm{font-size:.83rem;padding:10px 12px;align-items:center}.warn-box.danger{background:var(--coral-soft)}
.warn-box>.ic{margin-top:2px}
/* tools */
.tools{padding-top:52px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;flex:0 1 380px;min-height:48px;padding:0 6px 0 16px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-3);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--coral);box-shadow:0 0 0 4px var(--coral-soft)}.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);min-width:0;outline:none;height:44px}
.search.sm{min-height:38px;flex:0 1 300px}.search.sm input{height:36px;font-size:.88rem}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}.cats.wrapc{flex-wrap:wrap;overflow:visible;margin:14px 0}
.cat{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:36px;transition:all .15s}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}.cat:hover{border-color:var(--ink-3)}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl-count{margin:14px 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tcard{position:relative;display:flex;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.tc-main{flex:1;display:flex;flex-direction:column;align-items:stretch;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0;cursor:pointer;transition:border-color .2s,box-shadow .25s,transform .25s;overflow:hidden;box-shadow:var(--sh-1)}
.tc-main:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:var(--sh-3);transform:translateY(-4px)}

const TODAY = '2026-10-22';

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CODE_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeCode(r){let s='';for(let i=0;i<8;i++){s+=CODE_ALPHABET[Math.floor(r()*CODE_ALPHABET.length)];if(i===3)s+='-'}return s}

/* ---- seeded codes & sessions ---- */
function seedData(tools){
  const r=mulberry(2026);
  const codes=[];const sessions=[];const used=new Set();
  const demo={sb5:'SWD7-K2QX',dk1012:'DK10-7RMA',fsds:'FSD4-QW8P',b56r:'B56R-3HTZ',sb618:'S618-9KPL',b16:'B16P-4XNC',dk1316:'DK13-6YFE',tomal2:'TML2-8GDS',see:'SEE5-2JVB',pu1:'PU1M-5LRT',dkcp:'DKCP-TEST'};
  tools.forEach((t,ti)=>{
    codes.push({code:demo[t.id],tool:t.id,created:'2026-10-20',used:null,batch:'DEMO'});used.add(demo[t.id]);
    const n=t.status==='draft'?3:14+Math.floor(r()*14);
    for(let i=0;i<n;i++){let c;do{c=makeCode(r)}while(used.has(c));used.add(c);
      const day=1+Math.floor(r()*21);const created=`2026-${r()<.4?'09':'10'}-${String(day).padStart(2,'0')}`;
      codes.push({code:c,tool:t.id,created,used:null,batch:'P-'+(100+ti)})}
  });
  // sessions consume codes
  tools.filter(t=>t.status!=='draft').forEach(t=>{
    const tc=codes.filter(c=>c.tool===t.id&&c.batch!=='DEMO');
    const k=Math.min(tc.length-4,3+Math.floor(r()*6));
    for(let i=0;i<k;i++){const c=tc[i];
      const ay=t.age[0]+Math.floor(r()*Math.max(1,(t.age[2]-t.age[0]+1)));const am=Math.floor(r()*12);
      const ed=`2026-10-${String(1+Math.floor(r()*21)).padStart(2,'0')}`;
      const dob=shiftDate(ed,-ay,-am);
      const variant=t.variants[Math.floor(r()*t.variants.length)].id;
      const answers=demoAnswers(t,variant,mulberry(Math.floor(r()*1e9)));
      const metrics={sex:r()<.5?'k':'m',dob,exam:ed,place:['ppp','school','private'][Math.floor(r()*3)],grade:'sp48'};
      const time=`${String(8+Math.floor(r()*9)).padStart(2,'0')}:${String(Math.floor(r()*60)).padStart(2,'0')}`;
      c.used=ed+' '+time;
      sessions.push({id:'B-'+(4100+sessions.length),tool:t.id,code:c.code,date:ed,time,metrics,variant,answers,diag:['ppp-gdansk@','gabinet.kowal@','ppp-sopot@','szkola14@'][Math.floor(r()*4)]+'…'});
    }
  });
  sessions.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return {codes,sessions,demo};
}
function shiftDate(iso,dy,dm){const d=new Date(iso+'T12:00:00');d.setFullYear(d.getFullYear()+dy);d.setMonth(d.getMonth()+dm);d.setDate(Math.min(d.getDate(),28));return d.toISOString().slice(0,10)}

function allQuestions(tool){const out=[];tool.steps.forEach((s,si)=>s.sections.forEach((sec,ji)=>sec.questions.forEach((q,ki)=>out.push({q,s,sec,si,ji,ki}))));return out}
function demoAnswers(tool,variant,r){
  const a={};const bias={};
  tool.indicators.forEach(ind=>{const b=.25+r()*.65;ind.from.forEach(q=>bias[q]=b)});
  allQuestions(tool).forEach(({q})=>{
    if(q.disabledIn&&q.disabledIn.includes(variant))return;
    const b=bias[q.id]??(.3+r()*.6);
    if(q.type==='num'){if(q.scored===false){a[q.id]=String(60+Math.floor(r()*200));return}
      a[q.id]=String(Math.max(0,Math.min(q.max,Math.round(q.max*(b+(r()-.5)*.2)))))}
    else if(q.type==='radio'){const o=q.options.filter(x=>x.v!=='nd');
      if(q.layoutHint==='matrix'){let idx=Math.round((o.length-1)*Math.min(1,Math.max(0,b+(r()-.5)*.35)));a[q.id]=o[idx].v}
      else a[q.id]=o[Math.floor(r()*Math.min(2,o.length))].v}
    else if(q.type==='check'){a[q.id]=r()<.5?['none']:[q.options[0].v]}
    else if(q.type==='text'){a[q.id]='Obserwacja przykładowa (dane demo)'}
  });
  return a;
}

/* ---- dates & age ---- */
const MONTHS=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-').map(Number);return LANG==='en'?`${d} ${MONTHS_EN[m-1]} ${y}`:`${d} ${MONTHS[m-1]} ${y}`}
function fmtShort(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}.${m}.${y}`}
function ageAt(dob,at){if(!dob||!at)return null;const [y1,m1,d1]=dob.split('-').map(Number);const [y2,m2,d2]=at.split('-').map(Number);let months=(y2-y1)*12+(m2-m1);if(d2<d1)months--;if(months<0)return null;return {y:Math.floor(months/12),m:months%12,total:months}}
const fmtAge=a=>a?`${a.y};${a.m}`:'—';
const ageRange=t=>`${t.age[0]};${t.age[1]}–${t.age[2]};${t.age[3]}`;
function ageInRange(a,t){if(!a)return false;const lo=t.age[0]*12+t.age[1],hi=t.age[2]*12+t.age[3];return a.total>=lo&&a.total<=hi}

/* ---- scoring (stand-in for the uploaded calculation file) ---- */
function scaleDef(s){return s==='scaled'?{min:1,max:19,mean:10,sd:3,label:T('Wynik przeliczony'),short:T('WP')}:{min:1,max:10,mean:5.5,sd:2,label:'Sten',short:'Sten'}}
function phi(z){const t=1/(1+.2316419*Math.abs(z));const d=.3989423*Math.exp(-z*z/2);const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function qMap(tool){const m={};allQuestions(tool).forEach(x=>m[x.q.id]=x.q);return m}
const isOff=(q,variant)=>!!(q.disabledIn&&q.disabledIn.includes(variant));
function zoneFor(viz,score){return score==null?null:viz.zones.find(z=>score>=z.from&&score<=z.to)||null}
function iqClass(iq){const r=iq<70?['Znacznie poniżej przeciętnej','alarm']:iq<85?['Poniżej przeciętnej','low']:iq<=115?['Przeciętny','avg']:iq<=130?['Powyżej przeciętnej','high']:['Znacznie powyżej przeciętnej','high'];return [T(r[0]),r[1]]}
function computeResults(tool,study){
  const {answers={},variant,metrics={}}=study;const sd=scaleDef(tool.viz.scale);const qm=qMap(tool);
  const age=ageAt(metrics.dob,metrics.exam);
  const ageShift=age?((age.total%17)-8)/80:0; // deterministic pseudo-norm shift
  const rows=tool.indicators.map(ind=>{let raw=0,max=0,n=0;
    ind.from.forEach(id=>{const q=qm[id];if(!q||isOff(q,variant)||q.scored===false)return;const v=answers[id];if(v==null||v===''||v==='nd')return;
      if(q.type==='num'){raw+=+v;max+=+q.max;n++}
      else if(q.type==='radio'){const nums=q.options.map(o=>+o.v).filter(x=>!isNaN(x));raw+=+v;max+=Math.max(...nums);n++}});
    if(!n||!max)return {...ind,raw:null,max:null,score:null,pct:null,zone:null};
    const ratio=Math.max(0,Math.min(1,raw/max-ageShift));
    const score=Math.max(sd.min,Math.min(sd.max,Math.round(sd.min+(sd.max-sd.min)*ratio)));
    const pct=Math.max(1,Math.min(99,Math.round(phi((score-sd.mean)/sd.sd)*100)));
    return {...ind,raw,max,score,pct,zone:zoneFor(tool.viz,score)}});
  const byId=Object.fromEntries(rows.map(r=>[r.id,r]));
  const comps=(tool.composites||[]).map(c=>{const rs=c.of.map(id=>byId[id]).filter(r=>r&&r.score!=null);if(!rs.length)return {...c,value:null};
    if(c.type==='risk'){const low=rs.filter(r=>r.zone&&r.zone.tone==='alarm').length;const share=low/rs.length;const lvl=low===0?['niskie','high']:share<=.34?['umiarkowane','low']:['wysokie','alarm'];
      return {...c,value:Math.round(share*100),unit:'%',display:T(lvl[0]),tone:lvl[1],note:T('{a} z {b} obszarów w strefie ryzyka',{a:low,b:rs.length})}}
    if(c.type==='mean'){const m=rs.reduce((a,r)=>a+r.score,0)/rs.length;const s=Math.round(m);const z=zoneFor(tool.viz,s);return {...c,value:s,unit:sd.short,display:z?z.name:'—',tone:z?z.tone:'avg',pct:Math.round(phi((m-sd.mean)/sd.sd)*100)}}
    const mz=rs.reduce((a,r)=>a+(r.score-sd.mean)/sd.sd,0)/rs.length;const iq=Math.max(40,Math.min(160,Math.round(100+15*mz*1.08)));const cl=iqClass(iq);
    return {...c,value:iq,unit:c.asIQ?'SQ':T('II'),display:cl[0],tone:cl[1],pct:Math.max(1,Math.min(99,Math.round(phi((iq-100)/15)*100)))}});
  const scored=rows.filter(r=>r.score!=null);
  const strong=scored.filter(r=>r.zone&&r.zone.tone==='high').map(r=>r.name);
  const weak=scored.filter(r=>r.zone&&(r.zone.tone==='alarm'||r.zone.tone==='low')).map(r=>r.name);
  const vName=(tool.variants.find(v=>v.id===variant)||tool.variants[0]).name;
  const main=comps.find(c=>c.main)||comps[0];
  const desc=[];
  desc.push(T('Badanie narzędziem {t} ({v}) przeprowadzono {d}. Wiek osoby badanej w dniu badania: {a} (lata;miesiące).',{t:tool.name,v:vName.toLowerCase(),d:fmtDate(metrics.exam),a:fmtAge(age)}));
  if(main&&main.value!=null)desc.push(main.type==='risk'?`${main.name}: ${main.display} (${main.note}).`:T('{n} wynosi {v} ({d}{p}).',{n:main.name,v:main.value,d:main.display.toLowerCase(),p:main.pct?T(', {p}. centyl',{p:main.pct}):''}));
  if(strong.length)desc.push(T('Mocne strony: {x}.',{x:strong.join(', ')}));
  if(weak.length)desc.push(T('Obszary wymagające wsparcia: {x}.',{x:weak.join(', ')}));
  if(!weak.length)desc.push(T('Wszystkie wskaźniki mieszczą się w normie wiekowej lub powyżej niej.'));
  const rec=weak.length?[...weak.slice(0,3).map(w=>T('Zaplanuj zajęcia wspierające w obszarze: {x}.',{x:w})),T('Przekaż rodzicom/opiekunom wskazówki do ćwiczeń w domu.'),T('Rozważ badanie kontrolne za 6–12 miesięcy.')]:[T('Kontynuuj obserwację w środowisku szkolnym.'),T('Badanie kontrolne nie jest konieczne.')];
  const skipped=(study.skipped||[]).map(id=>(tool.steps.find(s=>s.id===id)||{}).title).filter(Boolean);
  if(skipped.length)desc.push(T('Pominięte kroki: {x}. Wskaźniki tych obszarów nie zostały obliczone.',{x:skipped.join(', ')}));
  return {rows,comps,main,desc,rec,age,vName,sd};
}

const DEFAULT_MSG={required:'To pole jest wymagane.',range:'Wpisz liczbę od {min} do {max}.',number:'Wpisz liczbę całkowitą.',other:'Opisz opcję „Inne”.',age:'Wiek {age} jest poza zakresem norm narzędzia ({range}).',future:'Data nie może być późniejsza niż dzisiejsza.'};
const msgOf=(tool,k,vars={})=>((tool.messages&&tool.messages[k])||T(DEFAULT_MSG[k])).replace(/\{(\w+)\}/g,(_,x)=>vars[x]??'');
function isVisible(q,answers){if(!q.showIf)return true;const v=answers[q.showIf.q];if(Array.isArray(v))return v.some(x=>q.showIf.in.includes(x));return q.showIf.in.includes(v)}
function validateQ(tool,q,answers,variant){
  if(isOff(q,variant)||!isVisible(q,answers))return null;const v=answers[q.id];
  const empty=v==null||v===''||(Array.isArray(v)&&!v.length);
  if(empty)return q.required?msgOf(tool,'required'):null;
  if(q.type==='num'){if(!/^\d+$/.test(String(v).trim()))return msgOf(tool,'number');const n=+v;if(n<q.min||n>q.max)return msgOf(tool,'range',{min:q.min,max:q.max})}
  if(q.type==='check'&&Array.isArray(v)&&v.includes('other')&&!(answers[q.id+'__other']||'').trim())return msgOf(tool,'other');
  if(q.type==='date'&&v>TODAY)return msgOf(tool,'future');
  return null}
function validateStep(tool,step,answers,variant){const e={};step.sections.forEach(s=>s.questions.forEach(q=>{const m=validateQ(tool,q,answers,variant);if(m)e[q.id]=m}));return e}

function Mark({s=22}){return html`<svg class="mark" width=${s*1.25} height=${s} viewBox="0 0 30 24" aria-hidden="true"><path d="M2 22L11 2h6L8 22zM13 22L22 2h6l-9 20z" fill="currentColor"/></svg>`}

/* ---- primitives ---- */
const STATUS={active:['Aktywne','ok'],draft:['Szkic','muted'],maint:['Konserwacja','warn']};
function StatusPill({s}){const [l,t]=STATUS[s]||['?','muted'];return html`<span class=${'pill p-'+t}><i></i>${T(l)}</span>`}
function Modal({title,sub,onClose,children,wide,foot}){
  useEffect(()=>{const k=e=>{if(e.key==='Escape')onClose&&onClose()};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)},[]);
  return html`<div class="modal-back" onClick=${e=>{if(e.target===e.currentTarget)onClose&&onClose()}}>
    <div class=${cx('modal',wide&&'wide')} role="dialog" aria-modal="true" aria-label=${title}>
      <div class="modal-h"><div><h3>${title}</h3>${sub&&html`<p>${sub}</p>`}</div><button class="icon-btn" onClick=${onClose} aria-label=${T('Zamknij')}><${Icon} n="x"/></button></div>
      <div class="modal-b">${children}</div>${foot&&html`<div class="modal-f">${foot}</div>`}</div></div>`}
function Seg({value,options,onChange,size}){return html`<div class=${cx('seg',size)} role="radiogroup">${options.map(o=>html`<button type="button" role="radio" aria-checked=${value===o.v} class=${value===o.v?'on':''} onClick=${()=>onChange(o.v)}>${o.i&&html`<${Icon} n=${o.i} s=${15}/>`}${o.l}</button>`)}</div>`}
function Toggle({on,onChange,label,id}){return html`<label class="tgl" for=${id}><input id=${id} type="checkbox" checked=${on} onChange=${e=>onChange(e.target.checked)}/><span class="tgl-t"></span>${label&&html`<span>${label}</span>`}</label>`}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast(T('Skopiowano do schowka')),()=>toast(T('Zaznacz tekst i skopiuj ręcznie'),'warn'))}catch(e){toast(T('Zaznacz tekst i skopiuj ręcznie'),'warn')}}
function useWidth(ref){const [w,setW]=useState(0);useLayoutEffect(()=>{if(!ref.current)return;const ro=new ResizeObserver(e=>setW(Math.round(e[0].contentRect.width)));ro.observe(ref.current);setW(ref.current.getBoundingClientRect().width);return()=>ro.disconnect()},[]);return w}

/* ============ three.js ambient scenes ============ */
const REDUCED=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
function cssColor(el,v,fb){const c=getComputedStyle(el).getPropertyValue(v).trim();return c||fb}

function Scene({mode='bell',cls}){
  const ref=useRef();
  useEffect(()=>{
    const el=ref.current;if(!el||!window.THREE||SKIN==='classic')return;
    let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'})}catch(e){return}
    const dpr=Math.min(2,window.devicePixelRatio||1);renderer.setPixelRatio(dpr);renderer.setClearColor(0x000000,0);
    renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';renderer.domElement.style.display='block';el.appendChild(renderer.domElement);
    const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(32,1,.1,100);
    const C=(v,f)=>new THREE.Color(cssColor(el,v,f));
    const coral=C('--coral','#FB5642'),ink=C('--sc-ink','#3A3531'),soft=C('--sc-soft','#CFC6BC'),cat=C('--sc-cool','#7C8FB8');
    const disposables=[];const keep=o=>{disposables.push(o);return o};
    const dot=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.7,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(32,32,30,0,Math.PI*2);g.fill();return keep(new THREE.CanvasTexture(c))})();
    let tick=()=>{};let mx=0,my=0;
    if(mode==='bell'){
      // a field of points shaped as the normal curve — the norms every test is scored against
      const NX=96,NZ=34,W=7.2,D=3.2;const pos=new Float32Array(NX*NZ*3),col=new Float32Array(NX*NZ*3);const base=[];
      let k=0;for(let i=0;i<NX;i++)for(let j=0;j<NZ;j++){const x=(i/(NX-1)-.5)*W,z=(j/(NZ-1)-.5)*D;base.push([x,z]);pos[k*3]=x;pos[k*3+2]=z;
        const sd=Math.abs(x)/(W/6);const c=sd>2?coral.clone():sd>1?soft.clone().lerp(ink,.25):ink.clone().lerp(soft,.35);const fade=1-Math.abs(z)/(D/2)*.75;c.lerp(new THREE.Color(cssColor(el,'--bg','#fff')),1-fade);col.set([c.r,c.g,c.b],k*3);k++}
      const g=keep(new THREE.BufferGeometry());g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
      const m=keep(new THREE.PointsMaterial({map:dot,alphaTest:.3,size:2.6*dpr,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.95,depthWrite:false}));
      const pts=new THREE.Points(g,m);scene.add(pts);
      // the main curve line
      const LN=200;const lp=new Float32Array(LN*3);const lg=keep(new THREE.BufferGeometry());lg.setAttribute('position',new THREE.BufferAttribute(lp,3));
      const line=new THREE.Line(lg,keep(new THREE.LineBasicMaterial({color:coral,transparent:true,opacity:.9})));scene.add(line);
      // sten boundaries as faint vertical ticks
      const tk=[];for(let s=1;s<=9;s++){const x=((s-5)/2)*(W/6);tk.push(x,0,0,x,.05,0)}
      const tg=keep(new THREE.BufferGeometry());tg.setAttribute('position',new THREE.Float32BufferAttribute(tk,3));scene.add(new THREE.LineSegments(tg,keep(new THREE.LineBasicMaterial({color:soft,transparent:true,opacity:.7}))));
      // score markers riding the curve
      const dots=[];const sg=keep(new THREE.SphereGeometry(.07,20,20));
      [[-.9,coral],[.35,ink],[1.4,cat]].forEach(([p,c],i)=>{const s=new THREE.Mesh(sg,keep(new THREE.MeshBasicMaterial({color:c})));s.userData={p,ph:i*2.1};scene.add(s);dots.push(s)});
      const ring=new THREE.Mesh(keep(new THREE.RingGeometry(.11,.135,40)),keep(new THREE.MeshBasicMaterial({color:coral,side:THREE.DoubleSide,transparent:true,opacity:.8})));scene.add(ring);
      const sig=W/6,A=1.55;const Y=(x,z,t)=>A*Math.exp(-(x*x)/(2*sig*sig))*(1+.07*Math.sin(t*1.1+z*2.2+x*.9))+.06*Math.sin(t*.8+x*1.6+z*3.1);
      cam.position.set(0,2.2,7.4);cam.lookAt(0,.55,0);
      tick=t=>{let a=pos;for(let q=0;q<base.length;q++){const [x,z]=base[q];a[q*3+1]=Y(x,z,t)}g.attributes.position.needsUpdate=true;
        for(let q=0;q<LN;q++){const x=(q/(LN-1)-.5)*W;lp[q*3]=x;lp[q*3+1]=Y(x,0,t)+.012;lp[q*3+2]=0}lg.attributes.position.needsUpdate=true;
        dots.forEach(d=>{const x=d.userData.p*sig+Math.sin(t*.35+d.userData.ph)*.35;d.position.set(x,Y(x,0,t)+.07,0)});
        ring.position.copy(dots[0].position);ring.lookAt(cam.position);const s=1+.35*Math.sin(t*2.4);ring.scale.set(s,s,s);ring.material.opacity=.55-.35*Math.sin(t*2.4);
        scene.rotation.y=Math.sin(t*.12)*.22+mx*.18;cam.position.y=2.2+my*.5;cam.lookAt(0,.55,0)};
    } else if(mode==='net'){
      // constellation of profiles: nodes and the links between similar results
      const N=110,R=2.4;const P=[];for(let i=0;i<N;i++){const u=Math.random()*2-1,th=Math.random()*Math.PI*2,r=R*Math.cbrt(Math.random());P.push(new THREE.Vector3(r*Math.sqrt(1-u*u)*Math.cos(th),r*u*.7,r*Math.sqrt(1-u*u)*Math.sin(th)))}
      const pg=keep(new THREE.BufferGeometry().setFromPoints(P));const cols=new Float32Array(N*3);P.forEach((p,i)=>{const c=i%9===0?coral:i%5===0?cat:ink;cols.set([c.r,c.g,c.b],i*3)});pg.setAttribute('color',new THREE.BufferAttribute(cols,3));
      scene.add(new THREE.Points(pg,keep(new THREE.PointsMaterial({map:dot,alphaTest:.3,size:4*dpr,sizeAttenuation:false,vertexColors:true}))));
      const seg=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(P[i].distanceTo(P[j])<.78)seg.push(P[i],P[j]);
      scene.add(new THREE.LineSegments(keep(new THREE.BufferGeometry().setFromPoints(seg)),keep(new THREE.LineBasicMaterial({color:soft,transparent:true,opacity:.55}))));
      const tor=new THREE.Mesh(keep(new THREE.TorusGeometry(1.6,.006,8,160)),keep(new THREE.MeshBasicMaterial({color:coral,transparent:true,opacity:.7})));tor.rotation.x=1.2;scene.add(tor);
      cam.position.set(0,0,7.2);
      tick=t=>{scene.rotation.y=t*.08+mx*.3;scene.rotation.x=Math.sin(t*.1)*.15+my*.2;tor.rotation.z=t*.2};
    } else if(mode==='morph'){
      // scattered raw scores settling onto the norm curve
      const N=420;const pos=new Float32Array(N*3);const from=[],to=[];for(let i=0;i<N;i++){from.push([(Math.random()-.5)*5,(Math.random()-.5)*3,(Math.random()-.5)*2]);
        let u=0;for(let k=0;k<6;k++)u+=Math.random();u=(u-3)/1.0;const x=u*.8;to.push([x,1.3*Math.exp(-x*x/(2*.64))*Math.random()-.55,(Math.random()-.5)*.25])}
      const g=keep(new THREE.BufferGeometry());g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      scene.add(new THREE.Points(g,keep(new THREE.PointsMaterial({map:dot,alphaTest:.3,size:3*dpr,sizeAttenuation:false,color:coral,transparent:true,opacity:.9}))));
      cam.position.set(0,.2,5.2);
      tick=t=>{const e=(Math.sin(t*1.6)+1)/2;const s=e*e*(3-2*e);for(let i=0;i<N;i++){for(let d=0;d<3;d++)pos[i*3+d]=from[i][d]+(to[i][d]-from[i][d])*s}g.attributes.position.needsUpdate=true;scene.rotation.y=Math.sin(t*.5)*.3};
    }
    const size=()=>{const w=el.clientWidth||1,h=el.clientHeight||1;renderer.setSize(w,h,false);cam.aspect=w/h;
      if(mode==='bell'){cam.position.z=w/h<1.1?10.5:7.4}cam.updateProjectionMatrix()};
    const ro=new ResizeObserver(size);ro.observe(el);size();
    const onMove=e=>{const r=el.getBoundingClientRect();mx=((e.clientX-r.left)/r.width-.5);my=((e.clientY-r.top)/r.height-.5)};
    window.addEventListener('pointermove',onMove,{passive:true});
    let raf=0,vis=true,t0=performance.now();
    const io=new IntersectionObserver(([en])=>{vis=en.isIntersecting;if(vis&&!raf&&!REDUCED)loop()});io.observe(el);
    const draw=()=>{tick((performance.now()-t0)/1000);renderer.render(scene,cam)};
    const loop=()=>{raf=0;if(!vis)return;draw();raf=requestAnimationFrame(loop)};
    if(REDUCED){tick(2);renderer.render(scene,cam)}else loop();
    return()=>{cancelAnimationFrame(raf);io.disconnect();ro.disconnect();window.removeEventListener('pointermove',onMove);disposables.forEach(d=>d.dispose&&d.dispose());renderer.dispose();try{renderer.forceContextLoss()}catch(e){}renderer.domElement.remove()};
  },[mode,SKIN]);
  return html`<div class=${cx('scene',cls)} ref=${ref} aria-hidden="true">${SKIN==='classic'&&mode==='morph'&&html`<div class="spin cl-spin"><${Mark} s=${34}/></div>`}</div>`}

/* ============ shared renderers: questions, steps, charts, report ============ */
function QField({tool,q,answers,set,variant,error,pv}){
  if(!isVisible(q,answers))return null;
  const off=isOff(q,variant);const v=answers[q.id];const id='q_'+q.id+(pv?'_pv':'');
  const upd=val=>set({...answers,[q.id]:val});
  let ctl;
  if(q.type==='num'){ctl=html`<div class=${cx('num-in',error&&'err')}><input id=${id} inputmode="numeric" autocomplete="off" disabled=${off} value=${off?'':(v??'')} placeholder=${off?'—':''} onInput=${e=>upd(e.target.value.replace(/[^\d]/g,''))} aria-invalid=${!!error} aria-describedby=${error?id+'_e':null}/><span class="suf">${q.scored===false?T('maks.')+' '+q.max:'/ '+q.max}</span></div>`}
  else if(q.type==='text'){ctl=html`<input id=${id} class=${cx('in',error&&'err')} disabled=${off} value=${v||''} placeholder=${q.placeholder||''} onInput=${e=>upd(e.target.value)}/>`}
  else if(q.type==='date'){ctl=html`<input id=${id} type="date" class=${cx('in',error&&'err')} max=${TODAY} value=${v||''} onInput=${e=>upd(e.target.value)}/>`}
  else if(q.type==='select'){ctl=html`<select id=${id} class=${cx('in',error&&'err')} value=${v||''} onChange=${e=>upd(e.target.value)}><option value="">${T('Wybierz…')}</option>${q.options.map(o=>html`<option value=${o.v}>${o.l}</option>`)}</select>`}
  else if(q.type==='radio'){ctl=html`<div class=${cx('chips',error&&'err')} role="radiogroup" aria-labelledby=${id+'_l'}>${q.options.map(o=>html`<button type="button" role="radio" aria-checked=${v===o.v} disabled=${off} class=${cx('chip',v===o.v&&'on')} onClick=${()=>upd(o.v)}>${o.l}</button>`)}</div>`}
  else if(q.type==='check'){const arr=Array.isArray(v)?v:[];const none=arr.includes('none');
    ctl=html`<div class="checks">${q.options.map(o=>{const on=arr.includes(o.v);const dis=off||(none&&!o.none);
      return html`<label class=${cx('ck',on&&'on',dis&&'dis')}><input type="checkbox" checked=${on} disabled=${dis} onChange=${e=>{let n=e.target.checked?[...arr,o.v]:arr.filter(x=>x!==o.v);if(o.none&&e.target.checked)n=['none'];set({...answers,[q.id]:n})}}/><span class="ck-b"><${Icon} n="check" s=${13}/></span>${o.l}</label>`})}</div>
      ${arr.includes('other')&&html`<input class=${cx('in reveal',error&&'err')} placeholder=${T('Opisz opcję „Inne”')} value=${answers[q.id+'__other']||''} onInput=${e=>set({...answers,[q.id+'__other']:e.target.value})}/>`}`}
  return html`<div class=${cx('qf','qt-'+q.type,off&&'off',q.showIf&&'cond')} data-q=${q.id}>
    <label class="qf-l" id=${id+'_l'} for=${id}>${q.label||html`<em class="muted">${T('Bez etykiety')}</em>`}${q.required&&!off&&html`<span class="req" aria-label=${T('wymagane')}>*</span>`}${off&&html`<span class="tag">${T('nie dotyczy w tej wersji')}</span>`}${q.showIf&&html`<span class="tag t-logic"><${Icon} n="branch" s=${12}/>${T('warunkowe')}</span>`}</label>
    ${ctl}${error&&html`<div class="qf-e" id=${id+'_e'}><${Icon} n="alert" s=${14}/>${error}</div>`}</div>`}

function Matrix({sec,answers,set,variant,errors,pv}){
  const cols=sec.columns||sec.questions[0]?.options||[];
  return html`<div class="mx" style=${{'--n':cols.length}}>
    <div class="mx-head" aria-hidden="true"><span></span>${cols.map(c=>html`<span>${c.l}</span>`)}</div>
    ${sec.questions.map((q,i)=>{const v=answers[q.id];const nm='mx_'+q.id+(pv?'pv':'');const err=errors&&errors[q.id];
      return html`<div class=${cx('mx-row',err&&'err')} role="radiogroup" aria-label=${q.label} key=${q.id} data-q=${q.id}>
        <span class="mx-q"><b>${i+1}.</b> ${q.label}</span>
        ${cols.map(c=>html`<label class=${cx('mx-cell',v===c.v&&'on',c.v==='nd'&&'nd')}><input type="radio" name=${nm} checked=${v===c.v} onChange=${()=>set({...answers,[q.id]:c.v})}/><span class="mx-dot"></span><span class="mx-l">${c.l}</span></label>`)}
        ${err&&html`<span class="qf-e mx-e"><${Icon} n="alert" s=${14}/>${err}</span>`}</div>`})}</div>`}

function SectionView(p){const {sec}=p;
  return html`<fieldset class="sec"><legend><span class="sl">//</span>${sec.title}</legend>${sec.desc&&html`<p class="sec-d">${sec.desc}</p>`}
    ${sec.layout==='matrix'?html`<${Matrix} ...${p}/>`:html`<div class=${sec.layout==='grid'?'q-grid':'q-list'}>${sec.questions.map(q=>html`<${QField} key=${q.id} q=${q} tool=${p.tool} answers=${p.answers} set=${p.set} variant=${p.variant} error=${p.errors&&p.errors[q.id]} pv=${p.pv}/>`)}</div>`}</fieldset>`}

function StepView(p){const {step}=p;
  return html`<div class="step-v">
    ${(step.instruction||step.image)&&html`<div class="instr">${step.image&&html`<img src=${step.image} alt=${T('Materiał do kroku')}/>`}<div><span class="eyebrow">${T('Instrukcja')}</span><p>${step.instruction}</p></div></div>`}
    ${step.sections.map(sec=>html`<${SectionView} key=${sec.id} sec=${sec} ...${p}/>`)}</div>`}

function MetricsView({tool,metrics,setM,variant,setVariant,errors,pv}){
  const age=ageAt(metrics.dob,metrics.exam);const ok=age&&ageInRange(age,tool);
  return html`<div class="metrics">
    ${tool.variants.length>1&&html`<fieldset class="sec"><legend><span class="sl">//</span>${T('Wersja badania')}</legend>
      <div class="variants">${tool.variants.map(v=>html`<label class=${cx('var',variant===v.id&&'on')}><input type="radio" name=${'var'+(pv?'pv':'')} checked=${variant===v.id} onChange=${()=>setVariant(v.id)}/><span class="var-r"></span><span>${v.name}</span></label>`)}</div></fieldset>`}
    ${tool.metrics.map(sec=>html`<fieldset class="sec" key=${sec.id}><legend><span class="sl">//</span>${sec.title}</legend>${sec.desc&&html`<p class="sec-d gdpr"><${Icon} n="shield" s=${15}/>${sec.desc}</p>`}
      <div class="q-grid">${sec.fields.map(f=>html`<${QField} key=${f.id} q=${f} tool=${tool} answers=${metrics} set=${setM} variant=${variant} error=${errors&&errors[f.id]} pv=${pv}/>`)}</div>
      ${sec.id==='m1'&&html`<div class=${cx('age-box',age&&(ok?'ok':'bad'))} aria-live="polite"><div><span class="eyebrow">${T('Wiek w dniu badania')}</span><b class="mono">${fmtAge(age)}</b><span class="muted small">${T('lata;miesiące')}</span></div>
        <div class="age-r">${!age?T('Uzupełnij daty, aby obliczyć wiek.'):ok?html`<${Icon} n="check" s=${16}/> ${T('Mieści się w normach')} (${ageRange(tool)})`:html`<${Icon} n="alert" s=${16}/> ${T('Poza normami narzędzia')} (${ageRange(tool)})`}</div></div>`}</fieldset>`)}</div>`}

/* ---------- profile chart ---------- */
function wrapLabel(s,n){const w=s.split(' ');const out=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>n&&cur){out.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)out.push(cur);return out.slice(0,3)}
function ProfileChart({tool,rows,viz}){
  viz=viz||tool.viz;const ref=useRef();const w=useWidth(ref);const sd=scaleDef(viz.scale);
  const pts=rows;const ticks=[];for(let i=sd.min;i<=sd.max;i++)ticks.push(i);
  const showTick=t=>sd.max<=10||t===sd.min||t===sd.max||(t-1)%3===0;
  let svg=null;
  if(w>0&&w<480){ // horizontal dot-plot for narrow screens
    const mL=8,mR=8,rowH=50,top=26,W=w,H=top+rowH*pts.length+8;const xs=v=>mL+(W-mL-mR)*(v-sd.min+.5)/(sd.max-sd.min+1);
    svg=html`<svg width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${T('Profil wyników')}>
      ${ticks.map(t=>showTick(t)&&html`<text x=${xs(t)} y="14" class="ch-tick" text-anchor="middle">${t}</text>`)}
      ${pts.map((r,i)=>{const y=top+i*rowH;return html`<g>
        <text x=${mL} y=${y+12} class="ch-lab">${r.name}</text>
        ${viz.zones.map(z=>html`<rect x=${xs(z.from)-(W-mL-mR)/(sd.max-sd.min+1)/2} y=${y+20} width=${(W-mL-mR)*(z.to-z.from+1)/(sd.max-sd.min+1)} height="14" class=${'zb z-'+z.tone}/>`)}
        ${viz.threshold&&html`<line x1=${xs(viz.threshold)} x2=${xs(viz.threshold)} y1=${y+17} y2=${y+37} class="ch-thr"/>`}
        ${r.score!=null?html`<circle cx=${xs(r.score)} cy=${y+27} r="8.5" class=${cx('ch-pt',r.zone&&'pt-'+r.zone.tone)}/><text x=${xs(r.score)} y=${y+30.5} class="ch-pv" text-anchor="middle">${r.score}</text>`:html`<text x=${W-mR} y=${y+12} class="ch-tick" text-anchor="end">${T('pominięto')}</text>`}
      </g>`})}</svg>`;
  } else if(w>0){
    const mL=34,mR=112,mT=viz.groups?34:16,mB=64,W=w,H=330;const n=pts.length;const cw=(W-mL-mR)/n;const X=i=>mL+cw*(i+.5);
    const Y=v=>mT+(H-mT-mB)*(1-(v-sd.min+.5)/(sd.max-sd.min+1));const band=(H-mT-mB)/(sd.max-sd.min+1);
    let gx=0;const groups=(viz.groups||[]).map(([g,k])=>{const s=gx;gx+=k;return {g,s,k}});
    const path=[];let seg=[];pts.forEach((r,i)=>{if(r.score==null){if(seg.length)path.push(seg);seg=[]}else seg.push([X(i),Y(r.score)])});if(seg.length)path.push(seg);
    svg=html`<svg width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${T('Profil wyników')}>
      ${viz.zones.map(z=>html`<g><rect x=${mL} y=${Y(z.to)-band/2} width=${W-mL-mR} height=${band*(z.to-z.from+1)} class=${'zb z-'+z.tone}/>

function Portal({preset,embedded,go}){
  useStore();useLang();
  const [page,setPage]=useState(preset?.page||'swd');
  const [view,setView]=useState(preset?.view||'list');const [toolId,setToolId]=useState(preset?.toolId||null);
  const rootRef=useRef();
  const raw=toolId&&toolById(toolId);const tool=raw&&L(raw);
  const toTop=(anchor)=>{const sc=embedded?rootRef.current?.closest('.ph-scroll'):null;
    setTimeout(()=>{const a=anchor&&rootRef.current?.querySelector('#pg-'+anchor);if(a){a.scrollIntoView({behavior:'smooth',block:'start'});return}if(sc)sc.scrollTop=0;else window.scrollTo(0,0)},20)};
  const nav=(v,id)=>{setPage('swd');setView(v);if(id!==undefined)setToolId(id);toTop()};

      ${page==='swd'&&view==='study'&&tool&&html`<div class="wrap"><${Study} key=${toolId} tool=${tool} preset=${preset} onExit=${()=>nav('list')} embedded=${embedded}/></div>`}
      ${page!=='swd'&&html`<${InfoPage} k=${page} onPage=${onPage} go=${go}/>`}
    </main>
    <${SiteFooter} go=${go} onPage=${onPage}/></div>`}

function Intro({tool,onBack,onStart}){const [v,setV]=useState(tool.variants[0].id);const slug=CATSLUG[toolById(tool.id)?.cat]||'iq';
  return html`<div class="intro" style=${{'--c':`var(--cat-${slug})`,'--cb':`var(--cat-${slug}-bg)`}}>
    <button class="back" onClick=${onBack}><${Icon} n="arrowL" s=${16}/>${T('Wszystkie narzędzia')}</button>
    <div class="intro-g">
      <div class="intro-c">
        <span class="kicker c"><i></i>${tool.cat}</span><h1>${tool.name}</h1><p class="lead">${tool.full}</p><p>${tool.desc}</p>
        <dl class="facts"><div><dt>${T('Wiek')}</dt><dd class="mono">${ageRange(tool)}</dd></div><div><dt>${T('Czas')}</dt><dd>${tool.minutes}</dd></div><div><dt>${T('Kroki')}</dt><dd class="mono">${tool.steps.length}</dd></div><div><dt>${T('Wersja')}</dt><dd class="mono">v${tool.version}</dd></div></dl>
        ${tool.needs.length>0&&html`<div class="needs"><span class="eyebrow">${T('Przygotuj')}</span><ul>${tool.needs.map(n=>html`<li><${Icon} n="check" s=${15}/>${n}</li>`)}</ul></div>`}
      </div>
      <aside class="intro-a"><div class="art-box"><${ToolArt} t=${tool}/></div>
        <div class="start-box">
          ${tool.variants.length>1&&html`<div class="sb-var"><span class="eyebrow">${T('Wersja badania')}</span><div class="vlist">${tool.variants.map(x=>html`<label class=${cx('var',v===x.id&&'on')}><input type="radio" name="iv" checked=${v===x.id} onChange=${()=>setV(x.id)}/><span class="var-r"></span><span>${x.name}</span></label>`)}</div></div>`}
          <button class="btn primary lg block" onClick=${()=>{window.__swdVariant=v;onStart()}}>${T('Rozpocznij badanie')}<${Icon} n="arrowR"/></button>
          <p class="small muted">${T('Rozpoczynając, akceptujesz zasady korzystania z SWD. Nie wpisuj danych osobowych osoby badanej.')}</p></div></aside></div></div>`}

/* ---------- study flow ---------- */
const PHASES=[['metrics','Dane metryczne'],['code','Kod'],['test','Odpowiedzi'],['result','Wynik']];
function defaultsFor(tool){const a={};allQuestions(tool).forEach(({q})=>{if(q.default!=null)a[q.id]=q.default});return a}
function sampleMetrics(tool){const y=Math.min(tool.age[2],tool.age[0]+7,Math.max(tool.age[0],Math.round((tool.age[0]+tool.age[2])/2)));return {sex:'k',dob:shiftDate(TODAY,-y,-4),exam:TODAY,place:'ppp',grade:y<7?'pre':y<10?'sp13':y<16?'sp48':'ponad',dx:['none'],pop:'gen'}}

function Study({tool,preset,onExit,embedded,testMode}){
  const fill=preset&&preset.fill&&preset.toolId===tool.id;
  const [phase,setPhase]=useState(fill?preset.phase:'metrics');
  const [variant,setVariant]=useState(window.__swdVariant&&tool.variants.some(v=>v.id===window.__swdVariant)?window.__swdVariant:tool.variants[0].id);
  const [metrics,setMetrics]=useState(fill?sampleMetrics(tool):{exam:TODAY});
  const [mErr,setMErr]=useState({});
  const [code,setCode]=useState(fill&&preset.phase!=='metrics'&&preset.phase!=='code'?Store.demo[tool.id]:'');
  const [answers,setAnswers]=useState(()=>fill&&preset.phase==='result'?{...defaultsFor(tool),...demoAnswers(tool,tool.variants[0].id,mulberry(7))}:defaultsFor(tool));
  const [stepIdx,setStepIdx]=useState(0);const [maxStep,setMaxStep]=useState(fill&&preset.phase==='result'?tool.steps.length-1:0);
  const [errs,setErrs]=useState({});const [skipped,setSkipped]=useState([]);
  const [calc,setCalc]=useState(false);const [modal,setModal]=useState(null);const [saved,setSaved]=useState(null);
  const [t0]=useState(Date.now());const [now,setNow]=useState(Date.now());
  useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),15000);return()=>clearInterval(i)},[]);
  useEffect(()=>{if(phase==='test')setSaved(new Date())},[answers]);
  const top=useRef();
  const scrollTop=()=>{const el=top.current;if(!el)return;const sc=el.closest('.ph-scroll');if(sc)sc.scrollTo({top:Math.max(0,el.offsetTop-8),behavior:'smooth'});else window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60,behavior:'smooth'})};
  const step=tool.steps[stepIdx];const res=useMemo(()=>phase==='result'?computeResults(tool,{answers,variant,metrics,skipped}):null,[phase,answers,variant,metrics,skipped,LANG]);
  const pi=PHASES.findIndex(p=>p[0]===phase);const locked=pi>=2;

  function submitMetrics(){const e={};tool.metrics.forEach(s=>s.fields.forEach(f=>{const m=validateQ(tool,f,metrics,variant);if(m)e[f.id]=m}));
    const a=ageAt(metrics.dob,metrics.exam);if(metrics.dob&&metrics.exam&&!e.dob){if(!a)e.dob=T('Data urodzenia musi być wcześniejsza niż data badania.');else if(!ageInRange(a,tool))e.dob=msgOf(tool,'age',{age:fmtAge(a),range:ageRange(tool)})}
    setMErr(e);if(Object.keys(e).length){toast(T('Popraw zaznaczone pola'),'warn');return}
    if(testMode){setCode('TRYB-TEST');setPhase('test');scrollTop();return}
    setPhase('code');scrollTop()}
  function next(){const e=validateStep(tool,step,answers,variant);setErrs(e);const n=Object.keys(e).length;
    if(n){toast(T('Uzupełnij pola w tym kroku: {n}',{n}),'warn');setTimeout(()=>{const el=(top.current||document).querySelector('.qf-e');el&&el.scrollIntoView({block:'center',behavior:'smooth'})},30);return}
    setSkipped(s=>s.filter(x=>x!==step.id));advance()}
  function advance(){if(stepIdx<tool.steps.length-1){const n=stepIdx+1;setStepIdx(n);setMaxStep(m=>Math.max(m,n));setErrs({});scrollTop()}else finish()}
  function skip(){setSkipped(s=>[...new Set([...s,step.id])]);setErrs({});advance()}
  function finish(){setCalc(true);scrollTop();setTimeout(()=>{setCalc(false);setPhase('result');
    if(!testMode){Store.sessions.unshift({id:'B-'+(4100+Store.sessions.length+Math.floor(Math.random()*90)),tool:tool.id,code,date:TODAY,time:new Date().toTimeString().slice(0,5),metrics,variant,answers,diag:T('Ty (bieżąca sesja)')});commit()}
    scrollTop()},1600)}
  function fillStep(){const d=demoAnswers(tool,variant,mulberry(Date.now()%1e6));const ids=new Set();step.sections.forEach(s=>s.questions.forEach(q=>ids.add(q.id)));const n={...answers};Object.keys(d).forEach(k=>{if(ids.has(k))n[k]=d[k]});setAnswers(n);setErrs({})}
  const mins=Math.floor((now-t0)/60000);

  return html`<div class="study" ref=${top}>
    <div class="st-head">
      <div class="st-title"><span class="tc-code sm">${tool.code}</span><div><b>${tool.name}</b><span class="muted small">${(tool.variants.find(v=>v.id===variant)||{}).name}${testMode?' · '+T('tryb testowy'):''}</span></div></div>
      <div class="st-chips">${code&&html`<span class="code-badge"><${Icon} n="lock" s=${14}/><span class="mono">${code}</span></span>`}${locked&&phase!=='result'&&html`<span class="chip-s"><${Icon} n="clock" s=${14}/>${mins} min · ${T('limit sesji 120 min')}</span>`}${phase==='test'&&saved&&html`<span class="chip-s ok"><${Icon} n="check" s=${14}/>${T('Zapisano w sesji')}</span>`}</div>
    </div>
    <ol class="phases" aria-label=${T('Etapy badania')}>${PHASES.map(([k,l],i)=>html`<li class=${cx(i<pi&&'done',i===pi&&'cur')} aria-current=${i===pi?'step':null}><span class="ph-n">${i<pi?html`<${Icon} n=${i<2&&locked?'lock':'check'} s=${13}/>`:i+1}</span><span class="ph-l">${T(l)}</span></li>`)}</ol>

    ${phase==='metrics'&&html`<section class="panel">
      <div class="panel-h"><h2>${T('Dane metryczne')}</h2><p class="muted">${T('Dane służą do doboru norm. Pola z gwiazdką są wymagane.')}</p></div>
      <${MetricsView} tool=${tool} metrics=${metrics} setM=${setMetrics} variant=${variant} setVariant=${setVariant} errors=${mErr}/>
      <div class="actions"><button class="btn ghost" onClick=${onExit}><${Icon} n="arrowL" s=${16}/>${T('Anuluj')}</button><span class="sp"></span><button class="btn subtle" onClick=${()=>{setMetrics(sampleMetrics(tool));setMErr({})}}><${Icon} n="zap" s=${16}/>${T('Dane przykładowe')}</button><button class="btn primary" onClick=${submitMetrics}>${testMode?T('Dalej: odpowiedzi'):T('Dalej: kod')}<${Icon} n="arrowR" s=${16}/></button></div></section>`}

    ${phase==='code'&&html`<${CodeEntry} tool=${tool} onBack=${()=>setPhase('metrics')} onOk=${c=>{setCode(c);setPhase('test');toast(T('Kod przyjęty. Badanie zostało odblokowane.'));scrollTop()}}/>`}

    ${phase==='test'&&!calc&&html`<section class="test-g">
      <nav class="steps-nav" aria-label=${T('Kroki testu')}>
        <div class="sn-prog"><span class="small muted">${T('Postęp')}</span><b class="mono">${Math.round((stepIdx)/tool.steps.length*100)}%</b><div class="bar"><i style=${{width:(stepIdx/tool.steps.length*100)+'%'}}></i></div></div>
        <ol>${tool.steps.map((s,i)=>{const sk=skipped.includes(s.id);const can=i<=maxStep;return html`<li><button disabled=${!can} class=${cx(i===stepIdx&&'cur',i<maxStep&&!sk&&i!==stepIdx&&'done',sk&&'skp')} onClick=${()=>{if(can){setStepIdx(i);setErrs({})}}}><span class="sn-d">${sk?html`<${Icon} n="skip" s=${11}/>`:i<maxStep&&i!==stepIdx?html`<${Icon} n="check" s=${11}/>`:i+1}</span><span>${s.title}</span></button></li>`})}</ol>
        <p class="sn-lock small muted"><${Icon} n="lock" s=${13}/>${T('Powrót do danych metrycznych jest zablokowany')}</p></nav>
      <div class="panel step-p">
        <div class="panel-h row"><div><span class="eyebrow">${T('Krok {a} z {b}',{a:stepIdx+1,b:tool.steps.length})}</span><h2>${step.title}</h2></div><button class="btn subtle sm" onClick=${fillStep} title=${T('Pomocnik prototypu')}><${Icon} n="zap" s=${15}/>${T('Wypełnij przykładowo')}</button></div>
        <div class="bar thin"><i style=${{width:((stepIdx+1)/tool.steps.length*100)+'%'}}></i></div>
        <${StepView} tool=${tool} step=${step} answers=${answers} set=${setAnswers} variant=${variant} errors=${errs}/>
        <div class="actions sticky-act"><button class="btn ghost" disabled=${stepIdx===0} onClick=${()=>{setStepIdx(stepIdx-1);setErrs({});scrollTop()}}><${Icon} n="arrowL" s=${16}/>${T('Wstecz')}</button><span class="sp"></span>
          ${step.skippable&&html`<button class="btn subtle" onClick=${skip}><${Icon} n="skip" s=${15}/>${T('Pomiń krok')}</button>`}
          <button class="btn primary" onClick=${next}>${stepIdx===tool.steps.length-1?T('Oblicz wynik'):T('Dalej')}<${Icon} n=${stepIdx===tool.steps.length-1?'chart':'arrowR'} s=${16}/></button></div></div></section>`}
    ${calc&&html`<section class="panel calc"><${Scene} mode="morph" cls="calc-scene"/><h2>${T('Obliczanie wyników…')}</h2><p class="muted">${T('Algorytm {f} przelicza wyniki surowe na normy dla wieku {a}.',{f:tool.calc?.file||'',a:fmtAge(ageAt(metrics.dob,metrics.exam))})}</p><div class="bar ind"><i></i></div></section>`}

    ${phase==='result'&&res&&html`<section class="result">
      <div class="res-note"><${Icon} n="info" s=${18}/><p>${T('Raport jest dostępny tylko w tej karcie przeglądarki. Pobierz PDF lub wyślij go e-mailem przed zamknięciem strony.')}</p></div>
      <${Report} tool=${tool} study=${{metrics,variant}} res=${res} code=${code}/>
      <div class="res-act"><button class="btn primary" onClick=${()=>setModal('pdf')}><${Icon} n="download" s=${17}/>${T('Pobierz PDF')}</button><button class="btn" onClick=${()=>setModal('mail')}><${Icon} n="mail" s=${17}/>${T('Wyślij e-mailem')}</button><span class="sp"></span><button class="btn ghost" onClick=${()=>setModal('new')}><${Icon} n="plus" s=${16}/>${T('Nowe badanie')}</button></div>
    </section>`}
    ${modal==='pdf'&&html`<${PdfModal} tool=${tool} res=${res} metrics=${metrics} variant=${variant} code=${code} onClose=${()=>setModal(null)}/>`}
    ${modal==='mail'&&html`<${MailModal} tool=${tool} onClose=${()=>setModal(null)}/>`}
    ${modal==='new'&&html`<${Modal} title=${T('Rozpocząć nowe badanie?')} onClose=${()=>setModal(null)} foot=${html`<button class="btn ghost" onClick=${()=>setModal(null)}>${T('Wróć do raportu')}</button><button class="btn primary" onClick=${onExit}>${T('Tak, zamknij raport')}</button>`}><p>${T('Bieżący raport nie jest przechowywany w systemie. Jeśli go nie pobrałeś ani nie wysłałeś, zostanie utracony.')}</p><//>`}
  </div>`}

function CodeEntry({tool,onBack,onOk}){const [v,setV]=useState('');const [err,setErr]=useState(null);const [busy,setBusy]=useState(false);const inp=useRef();const [focus,setFocus]=useState(false);
  const raw=v.replace(/-/g,'');
  const onIn=e=>{let s=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);setV(s.length>4?s.slice(0,4)+'-'+s.slice(4):s);setErr(null)};
  const submit=()=>{if(raw.length<8){setErr(T('Kod ma 8 znaków w formacie XXXX-XXXX.'));return}setBusy(true);
    setTimeout(()=>{setBusy(false);const c=Store.codes.find(x=>x.code===v);
      if(!c)return setErr(T('Kod nie istnieje. Sprawdź, czy przepisujesz go z protokołu tego narzędzia.'));
      if(c.tool!==tool.id)return setErr(T('Ten kod dotyczy narzędzia {t}. Wybierz właściwe narzędzie albo inny kod.',{t:toolById(c.tool)?.name}));
      if(c.used&&c.batch!=='DEMO')return setErr(T('Kod został już wykorzystany ({d}). Każdy kod odpowiada jednemu badaniu.',{d:c.used}));
      if(c.batch!=='DEMO'){c.used=TODAY+' '+new Date().toTimeString().slice(0,5);commit()}
      onOk(v)},450)};
  const demo=Store.demo[tool.id];
  return html`<section class="panel code-p">
    <div class="code-g"><div class="code-art"><span class="lockc"><${Icon} n="lock" s=${30}/></span><span class="ring r1"></span><span class="ring r2"></span></div>
    <div class="code-f"><span class="eyebrow">${T('Krok {a} z {b}',{a:2,b:4})}</span><h2>${T('Wpisz jednorazowy kod')}</h2><p class="muted">${T('Kod znajdziesz w protokole narzędzia {t}. Każdy kod odblokowuje jedno badanie.',{t:tool.name})}</p>
      <label class="sr" for="code-in">${T('Kod badania')}</label>
      <div class=${cx('slots',err&&'err',focus&&'focus')} onClick=${()=>inp.current&&inp.current.focus()}>
        <input id="code-in" ref=${inp} value=${v} onInput=${onIn} onFocus=${()=>setFocus(true)} onBlur=${()=>setFocus(false)} onKeyDown=${e=>e.key==='Enter'&&submit()} autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="9" aria-invalid=${!!err}/>
        ${[0,1,2,3,'-',4,5,6,7].map(i=>i==='-'?html`<span class="slot-d">–</span>`:html`<span class=${cx('slot',raw[i]&&'f',focus&&raw.length===i&&'c')}>${raw[i]||''}</span>`)}</div>
      ${err&&html`<div class="qf-e" role="alert"><${Icon} n="alert" s=${14}/>${err}</div>`}
      <div class="demo-code"><span class="small muted">${T('Kod demonstracyjny:')}</span><button class="mono link" onClick=${()=>{setV(demo);setErr(null)}}>${demo}</button><span class="small muted">· ${T('działa wielokrotnie w prototypie')}</span></div>
      <div class="warn-box sm"><span class="wb-i"><${Icon} n="alert" s=${16}/></span><p>${T('Po przyjęciu kodu nie wrócisz do danych metrycznych. Cofnięcie strony w przeglądarce unieważni kod.')}</p></div>
      <div class="actions"><button class="btn ghost" onClick=${onBack}><${Icon} n="arrowL" s=${16}/>${T('Dane metryczne')}</button><span class="sp"></span><button class="btn primary" onClick=${submit} disabled=${busy}>${busy?T('Sprawdzanie…'):T('Zatwierdź kod')}<${Icon} n="key" s=${16}/></button></div></div></div></section>`}

function PdfModal({tool,res,metrics,variant,code,onClose}){const [st,setSt]=useState('gen');useEffect(()=>{const t=setTimeout(()=>setSt('ok'),900);return()=>clearTimeout(t)},[]);
  const fname=`${LANG==='en'?'report':'raport'}_${tool.code.replace(/[^A-Za-z0-9]+/g,'')}_${metrics.exam}.pdf`;
  return html`<${Modal} wide title=${T('Raport PDF')} sub=${st==='gen'?T('Generowanie dokumentu…'):fname+' · A4 · '+T('2 strony')} onClose=${onClose} foot=${html`<span class="small muted">${T('W podglądzie prototypu pobieranie plików jest wyłączone. Tak będzie wyglądał dokument.')}</span><span class="sp"></span><button class="btn primary" onClick=${()=>{toast(T('W docelowym systemie plik {f} zapisze się na urządzeniu.',{f:fname}),'info')}} disabled=${st==='gen'}><${Icon} n="download" s=${16}/>${T('Zapisz plik')}</button>`}>
    ${st==='gen'?html`<div class="calc sm"><${Scene} mode="morph" cls="calc-scene sm"/><div class="bar ind"><i></i></div></div>`:html`<div class="pdf-stage"><div class="pdf-page"><${Report} tool=${tool} study=${{metrics,variant}} res=${res} code=${code} paper/></div></div>`}<//>`}
function MailModal({tool,onClose}){const [m,setM]=useState('');const [ok,setOk]=useState(false);const [e,setE]=useState(null);const [att,setAtt]=useState(true);
  const send=()=>{if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(m))return setE(T('Wpisz poprawny adres e-mail, np. gabinet@poradnia.pl.'));if(!ok)return setE(T('Potwierdź, że adres należy do osoby uprawnionej do wyników.'));toast(T('Raport przygotowany do wysyłki na {m} (symulacja prototypu)',{m}));onClose()};
  return html`<${Modal} title=${T('Wyślij raport e-mailem')} sub=${tool.name} onClose=${onClose} foot=${html`<button class="btn ghost" onClick=${onClose}>${T('Anuluj')}</button><button class="btn primary" onClick=${send}><${Icon} n="send" s=${16}/>${T('Wyślij')}</button>`}>
    <div class="form-v"><label class="qf-l" for="mail-in">${T('Adres odbiorcy')}</label><input id="mail-in" class=${cx('in',e&&'err')} type="email" placeholder="gabinet@poradnia.pl" value=${m} onInput=${x=>{setM(x.target.value);setE(null)}}/>
    <label class="ck-row"><input type="checkbox" checked=${att} onChange=${x=>setAtt(x.target.checked)}/>${T('Dołącz raport PDF')}</label>
    <label class="ck-row"><input type="checkbox" checked=${ok} onChange=${x=>{setOk(x.target.checked);setE(null)}}/>${T('Potwierdzam, że adres należy do osoby uprawnionej do otrzymania wyników')}</label>
    ${e&&html`<div class="qf-e"><${Icon} n="alert" s=${14}/>${e}</div>`}<p class="small muted">${T('Adres nie jest zapisywany w systemie. Raport zostanie wysłany jednorazowo.')}</p></div><//>`}

/* ---------- client's current-site styling: SWD page as on pracowniatestow.pl ---------- */
function ClassicList({onOpen,onPage}){const S=useStore();const [q,setQ]=useState('');
  const list=S.tools.filter(t=>t.status!=='draft').filter(t=>{if(!q)return true;const l=L(t);return (t.name+' '+t.code+' '+l.name+' '+l.full).toLowerCase().includes(q.toLowerCase())});
  return html`<div class="wrap cl">
    <nav class="crumbs" aria-label=${T('Okruszki')}><button onClick=${()=>onPage('home')}>${T('Strona główna')}</button><span>»</span><b>${T('System Wsparcia Diagnosty')}</b></nav>
    <h1 class="cl-title">${T('System Wsparcia Diagnosty')}</h1>
    <div class="cl-g">
      <section class="cl-banner">
        <div class="cl-swd"><span class="cl-swd-b">SWD</span><p>${T('Narzędzia online wspierające proces diagnozy i interpretacji wyników.')}</p></div>
        <div class="cl-art"><${ToolArt} t=${{code:'SWD'}}/></div>
        <div class="cl-warn"><${Icon} n="alert" s=${30}/><p>${T('Kody Systemu Wsparcia Diagnosty są jednorazowe. Po wprowadzeniu i zaakceptowaniu kodu cofnięcie się do poprzedniej strony spowoduje bezpowrotną utratę zarówno kodu, jak i wprowadzonych wyników. W takiej sytuacji konieczne będzie użycie nowego jednorazowego kodu oraz ponowne wprowadzenie danych.')}</p></div>
        <p class="cl-note">${T('Aby uruchomić System Wsparcia Diagnosty (SWD) kliknij wybrany przycisk. Tym samym akceptujesz zasady korzystania z SWD (poniżej).')}</p>
      </section>
      <section class="cl-tools" aria-label=${T('Narzędzia diagnostyczne')}>
        <label class="cl-search"><${Icon} n="search" s=${16}/><input id="cl-q" placeholder=${T('Szukaj narzędzia')} value=${q} onInput=${e=>setQ(e.target.value)}/></label>
        <div class="cl-list">${list.map(raw=>{const t=L(raw);const m=t.status==='maint';return html`<button class=${cx('cl-btn',m&&'maint')} disabled=${m} onClick=${()=>onOpen(t.id)}>
          <span class="cl-bt"><b>${t.name}</b><small>${m?T('Przerwa techniczna — aktualizacja norm'):`${ageRange(t)} · ${t.minutes}`}</small></span><span class="cl-mk"><${Mark} s=${18}/></span></button>`})}
          ${!list.length&&html`<p class="muted">${T('Brak narzędzi dla „{q}”. Sprawdź pisownię lub wybierz inną kategorię.',{q})}</p>`}

function ContactForm(){const [f,setF]=useState({name:'',mail:'',topic:'swd',msg:''});const [e,setE]=useState({});
  const send=ev=>{ev.preventDefault();const er={};if(!f.name.trim())er.name=T('To pole jest wymagane.');if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(f.mail))er.mail=T('Wpisz poprawny adres e-mail, np. gabinet@poradnia.pl.');if(f.msg.trim().length<10)er.msg=T('Napisz co najmniej 10 znaków.');setE(er);if(Object.keys(er).length)return;toast(T('Wiadomość przygotowana do wysłania (symulacja prototypu)'));setF({name:'',mail:'',topic:'swd',msg:''})};
  const u=k=>x=>setF({...f,[k]:x.target.value});
  return html`<form class="ct-form" onSubmit=${send} novalidate><h3>${T('Napisz do nas')}</h3>
    <div class="pp-2"><div class="pf"><label class="qf-l" for="ct-n">${T('Imię i nazwisko')}</label><input id="ct-n" class=${cx('in',e.name&&'err')} value=${f.name} onInput=${u('name')}/>${e.name&&html`<div class="qf-e">${e.name}</div>`}</div>
      <div class="pf"><label class="qf-l" for="ct-m">E-mail</label><input id="ct-m" class=${cx('in',e.mail&&'err')} value=${f.mail} onInput=${u('mail')}/>${e.mail&&html`<div class="qf-e">${e.mail}</div>`}</div></div>
    <div class="pf"><label class="qf-l" for="ct-t">${T('Temat')}</label><select id="ct-t" class="in" value=${f.topic} onChange=${u('topic')}>${[['swd','System Wsparcia Diagnosty'],['shop','Zamówienia'],['train','Szkolenia'],['other','Inne']].map(([v,l])=>html`<option value=${v}>${T(l)}</option>`)}</select></div>
    <div class="pf"><label class="qf-l" for="ct-x">${T('Wiadomość')}</label><textarea id="ct-x" rows="5" class=${cx('in',e.msg&&'err')} value=${f.msg} onInput=${u('msg')}></textarea>${e.msg&&html`<div class="qf-e">${e.msg}</div>`}</div>
    <button class="btn primary">${T('Wyślij wiadomość')}<${Icon} n="send" s=${16}/></button></form>`}

  const open=id=>{setEditId(id);setView('editor');window.scrollTo(0,0)};
  return html`<div class="adm">
    <aside class="adm-side">
      <div class="as-brand"><${Mark} s=${22}/><div><b>${T('SWD')}</b><small>${T('Panel administratora')}</small></div></div>
      <nav class="as-nav">${[['tools','grid',T('Narzędzia')],['service','table',T('Serwis')],['codes','key',T('Kody dostępu')]].map(([k,i,l])=>html`<button class=${(view===k||(k==='tools'&&(view==='editor'||view==='test')))?'on':''} onClick=${()=>{setView(k);setTestTool(null)}}><${Icon} n=${i}/>${l}</button>`)}</nav>

        <button onClick=${()=>{resetStore();toast(T('Przywrócono dane demonstracyjne'))}}><${Icon} n="rotate"/>${T('Przywróć dane demo')}</button>
        <div class="as-lang"><${LangSwitch}/><${SkinSwitch}/></div><div class="as-user"><span class="av">${T('AD')}</span><div><b>${T('Administrator')}</b><small>${T('admin@pracowniatestow.pl')}</small></div><button class="icon-btn sm" onClick=${logout} aria-label=${T('Wyloguj')}><${Icon} n="logout" s=${16}/></button></div></div>
    </aside>
    <div class="adm-main">
      ${view==='tools'&&html`<${ToolsView} onEdit=${open} onTest=${t=>{setTestTool(clone(t));setView('test')}} onCodes=${id=>setCodesFor(id)}/>`}
      ${view==='editor'&&html`<${Editor} key=${editId} toolId=${editId} onBack=${()=>setView('tools')} onTest=${t=>{setTestTool(clone(t));setView('test')}} onCodes=${id=>setCodesFor(id)}/>`}
      ${view==='test'&&testTool&&html`<div class="adm-pad"><div class="test-banner"><${Icon} n="play" s=${16}/><b>${T('Środowisko testowe')}</b><span>${T('Narzędzie „{n}” w bieżącej wersji roboczej. Kod nie jest wymagany, a wynik nie trafia do bazy.',{n:testTool.name})}</span><span class="sp"></span><button class="btn sm" onClick=${()=>setView(editId?'editor':'tools')}>${T('Zakończ test')}</button></div>
        <div class="swd test-swd"><${Study} key=${testTool.id+Store.ver} tool=${testTool} testMode onExit=${()=>setView(editId?'editor':'tools')}/></div></div>`}
      ${view==='service'&&html`<${ServiceView}/>`}
      ${view==='codes'&&html`<${CodesView} onGen=${id=>setCodesFor(id||'sb5')}/>`}
    </div>
    ${codesFor&&html`<${CodeGenModal} toolId=${codesFor} onClose=${()=>setCodesFor(null)}/>`}
  </div>`}

    <div class="login-art"><${Scene} mode="net"/><div class="la-in"><${Mark} s=${46}/><h1>${T('System Wsparcia Diagnosty')}</h1><p>${T('Panel administratora. Twórz i edytuj narzędzia, konfiguruj wizualizacje wyników, generuj kody i eksportuj dane.')}</p>

    <form class="login-f" onSubmit=${submit}><div class="lf-top"><${LangSwitch}/></div><span class="proto-tag dark"><span class="dot"></span>${T('Prototyp · dane demonstracyjne wpisane')}</span><h2>${T('Zaloguj się')}</h2>

/* ---------- validation of a tool definition ---------- */
function toolIssues(t){const out=[];const ids=new Set();const qs=allQuestions(t);
  qs.forEach(({q})=>ids.add(q.id));
  if(!t.name.trim())out.push({node:'intro',msg:T('Brak nazwy narzędzia'),lvl:'err'});
  t.steps.forEach((s,si)=>{if(!s.title.trim())out.push({node:'st:'+si,msg:T('Krok {n}: brak tytułu',{n:si+1}),lvl:'err'});if(!s.instruction.trim())out.push({node:'st:'+si,msg:T('Krok „{t}”: brak instrukcji',{t:T(s.title)}),lvl:'warn'});
    const n=s.sections.reduce((a,x)=>a+x.questions.length,0);if(!n)out.push({node:'st:'+si,msg:T('Krok „{t}” nie ma pytań',{t:T(s.title)}),lvl:'err'});
    s.sections.forEach((sec,ji)=>sec.questions.forEach((q,ki)=>{const node=`q:${si}:${ji}:${ki}`;const nm=T(q.label)||T('Pytanie {n}',{n:ki+1});
      if(!q.label.trim())out.push({node,msg:T('{t}: pytanie bez etykiety',{t:T(s.title)}),lvl:'err',q:q.id});
      if(q.type==='num'&&!(+q.min<+q.max))out.push({node,msg:T('{n}: zakres {a}–{b} jest niepoprawny',{n:nm,a:q.min,b:q.max}),lvl:'err',q:q.id});
      if((q.type==='radio'||q.type==='select'||q.type==='check')&&(q.options||[]).length<2)out.push({node,msg:T('{n}: dodaj co najmniej 2 odpowiedzi',{n:nm}),lvl:'err',q:q.id});
      if(q.showIf&&!ids.has(q.showIf.q))out.push({node,msg:T('{n}: warunek odwołuje się do nieistniejącego pytania',{n:nm}),lvl:'err',q:q.id})}))});
  t.indicators.forEach(ind=>ind.from.forEach(f=>{if(!ids.has(f))out.push({node:'logic',msg:T('Wskaźnik „{n}”: brak pytania {f}',{n:T(ind.name),f}),lvl:'err'})}));
  if(!t.calc)out.push({node:'logic',msg:T('Brak pliku logiki obliczeń'),lvl:'err'});
  return out}
function fieldCount(t){return allQuestions(t).length+t.metrics.reduce((a,s)=>a+s.fields.length,0)}

  const [seed,setSeed]=useState(3);const [showIssues,setShowIssues]=useState(false);const [addFor,setAddFor]=useState(null);const [open,setOpen]=useState({});const [t0]=useState(Date.now());const [,tick]=useState(0);

  const [kind,a,b,c]=sel.split(':');const sIdx=+a,jIdx=+b,kIdx=+c;
  const step=(kind==='st'||kind==='sc'||kind==='q')?d.steps[sIdx]:null;const sec=(kind==='sc'||kind==='q')&&step?step.sections[jIdx]:null;const q=kind==='q'&&sec?sec.questions[kIdx]:null;
  const mf=kind==='mf'?d.metrics[sIdx].fields[jIdx]:null;
