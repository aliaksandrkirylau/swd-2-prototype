  const hl=q?q.id:mf?mf.id:null;
  const pvRef=useRef();
  useEffect(()=>{const r=pvRef.current;if(!r)return;r.querySelectorAll('.pv-hl').forEach(x=>x.classList.remove('pv-hl'));if(!hl)return;const el=r.querySelector(`[data-q="${hl}"]`);if(el){el.classList.add('pv-hl');el.scrollIntoView({block:'nearest',behavior:'smooth'})}},[sel,d,dev]);

  const addQ=(si,ji,type)=>{up(n=>{const id=type+'_'+Math.random().toString(36).slice(2,6);n.steps[si].sections[ji].questions.push(newQ(type,id))});const k=d.steps[si].sections[ji].questions.length;setSel(`q:${si}:${ji}:${k}`);setAddFor(null)};
  const mv=(arr,i,dlt)=>{const j=i+dlt;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true};

  const preview=()=>{
    const ld=L(d);if(kind==='intro'||kind==='status')return html`<${Intro} tool=${ld} onBack=${()=>{}} onStart=${()=>toast(T('Podgląd — w portalu rozpocznie się badanie'),'info')}/>`;
    if(kind==='metrics'||kind==='mf')return html`<div class="panel"><div class="panel-h"><h2>${T('Dane metryczne')}</h2></div><${MetricsView} tool=${ld} metrics=${pvM} setM=${setPvM} variant=${pvV} setVariant=${setPvV} pv/></div>`;
    if(kind==='viz'||kind==='logic')return html`<${Report} tool=${ld} study=${{metrics:sampleMetrics(d),variant:d.variants[0].id}} res=${res} code="PODG-LĄD1"/>`;
    if(kind==='msg'){const fake={id:'x',type:'num',label:T('Przykładowe pole'),min:0,max:20,required:true};return html`<div class="panel"><div class="panel-h"><h2>${T('Komunikaty walidacji')}</h2><p class="muted">${T('Tak diagnosta zobaczy błędy.')}</p></div><div class="q-grid">${[['required',''],['range','25'],['number','4,5']].map(([k,v])=>html`<${QField} tool=${d} q=${{...fake,id:'x'+k,label:{required:T('Pole wymagane'),range:T('Wartość spoza zakresu'),number:T('Niepoprawny format')}[k]}} answers=${{['x'+k]:v}} set=${()=>{}} variant="full" error=${msgOf(d,k,{min:0,max:20})} pv/>`)}</div></div>`}
    return html`<div class="panel step-p"><div class="panel-h"><span class="eyebrow">${T('Krok {a} z {b}',{a:d.steps.indexOf(pvStep)+1,b:d.steps.length})}</span><h2>${T(pvStep.title)||T('Bez tytułu')}</h2></div><${StepView} tool=${ld} step=${ld.steps[d.steps.indexOf(pvStep)]} answers=${pvA} set=${setPvA} variant=${pvV} errors=${{}} pv/>
      <div class="actions"><button class="btn ghost" disabled><${Icon} n="arrowL" s=${16}/>${T('Wstecz')}</button><span class="sp"></span>${pvStep.skippable&&html`<button class="btn subtle"><${Icon} n="skip" s=${15}/>${T('Pomiń krok')}</button>`}<button class="btn primary" onClick=${()=>{const e=validateStep(d,pvStep,pvA,pvV);toast(Object.keys(e).length?`Walidacja: ${Object.keys(e).length} błędów w kroku`:T('Walidacja kroku: OK'),Object.keys(e).length?'warn':'ok')}}>${T('Sprawdź walidację')}<${Icon} n="check" s=${16}/></button></div></div>`};

  const errNodes=new Set(errs.map(e=>e.node));
  const stepHasErr=si=>errs.some(e=>e.node.startsWith('st:'+si)||e.node.startsWith('q:'+si+':'));

  return html`<div class="ed">
    <div class="ed-top">
      <button class="icon-btn" onClick=${()=>dirty?setConfirmLeave(true):onBack()} aria-label=${T('Wróć do listy')}><${Icon} n="arrowL"/></button>
      <div class="ed-t"><span class="muted small">${T('Narzędzia /')}</span><b>${d.name||T('Bez nazwy')}</b><${StatusPill} s=${d.status}/><span class="mono small muted">v${d.version}</span>${dirty&&html`<span class="dirty">${T('Niezapisane zmiany')}</span>`}</div>
      <span class="sp"></span>
      <span class="chip-s" title=${T('Cel: nowe narzędzie w < 15 min')}><${Icon} n="clock" s=${14}/>${T('Edycja')} ${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}</span>
      <div class="val-wrap"><button class=${cx('val',errs.length?'bad':'good')} onClick=${()=>setShowIssues(!showIssues)} aria-expanded=${showIssues}>
        <svg width="22" height="22" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="vr-bg"/><circle cx="18" cy="18" r="15" class="vr-fg" stroke-dasharray=${`${94.2*okN/Math.max(1,total)} 94.2`}/></svg>
        <span><b class="mono">${okN}/${total}</b> ${T('pól poprawnych')}</span>${errs.length>0&&html`<span class="val-n">${errs.length}</span>`}</button>
        ${showIssues&&html`<div class="issues"><div class="iss-h"><b>${T('Walidacja konfiguracji')}</b><span class="muted small">${T('{a} błędów · {b} ostrzeżeń',{a:errs.length,b:issues.length-errs.length})}</span></div>
          ${issues.length?issues.map(i=>html`<button class=${'iss '+i.lvl} onClick=${()=>{setSel(i.node);setShowIssues(false)}}><${Icon} n=${i.lvl==='err'?'alert':'info'} s=${15}/><span>${i.msg}</span><${Icon} n="chevR" s=${14}/></button>`):html`<p class="iss-ok"><${Icon} n="check"/>${T('Wszystkie pola są poprawne. Narzędzie można aktywować.')}</p>`}</div>`}</div>
      <button class="btn sm" onClick=${()=>onTest(d)}><${Icon} n="play" s=${14}/>${T('Testuj')}</button>
      <button class="btn sm" onClick=${()=>onCodes(d.id)}><${Icon} n="key" s=${14}/>${T('Kody')}</button>
      <button class="btn sm primary" onClick=${save} disabled=${!dirty}><${Icon} n="check" s=${15}/>${T('Zapisz')}</button>
    </div>
    <div class="ed-g">
      <aside class="ed-tree" aria-label=${T('Struktura narzędzia')}>
        <div class="tr-h">${T('Struktura')}</div>
        <${TreeItem} sel=${sel} setSel=${setSel} k="intro" icon="file" label=${T('Informacje wstępne')} err=${errNodes.has('intro')}/>
        <${TreeItem} sel=${sel} setSel=${setSel} k="metrics" icon="user" label=${T('Dane metryczne')} count=${d.metrics.reduce((a,s)=>a+s.fields.length,0)}/>
        ${(sel==='metrics'||kind==='mf')&&d.metrics.map((ms,si)=>ms.fields.map((f,fi)=>html`<${TreeItem} sel=${sel} setSel=${setSel} k=${`mf:${si}:${fi}`} icon=${(QTYPES.find(x=>x[0]===f.type)||[])[1]||'text'} label=${T(f.label)} depth=${1}/>`))}
        <div class="tr-h row">${T('Ścieżka badania')}<button class="icon-btn xs" title=${T('Dodaj krok')} onClick=${()=>{up(n=>n.steps.push({id:'s'+(n.steps.length+1)+'_'+Date.now()%1000,title:T('Nowy krok'),instruction:'',skippable:false,sections:[{id:'a',title:T('Sekcja 1'),layout:'grid',questions:[]}]}));setSel('st:'+d.steps.length)}}><${Icon} n="plus" s=${14}/></button></div>
        ${d.steps.map((s,si)=>{const isOpen=open[si]??(sIdx===si&&kind!=='intro');return html`<div class="tr-step">
          <${TreeItem} sel=${sel} setSel=${setSel} k=${'st:'+si} icon=${isOpen?'chevD':'chevR'} label=${T(s.title)||T('Bez tytułu')} sub=${T('Krok {n}',{n:si+1})+(s.skippable?T(' · można pominąć'):'')} err=${stepHasErr(si)} actions=${html`<button class="icon-btn xs" onClick=${()=>setOpen({...open,[si]:!isOpen})} aria-label=${T('Rozwiń')}><${Icon} n=${isOpen?'chevU':'chevD'} s=${13}/></button>`}/>
          ${isOpen&&s.sections.map((sc,ji)=>html`<${TreeItem} sel=${sel} setSel=${setSel} k=${`sc:${si}:${ji}`} icon=${LAYOUTS.find(l=>l.v===sc.layout).i} label=${T(sc.title)} depth=${1} count=${sc.questions.length}/>
            ${sc.questions.map((qq,ki)=>html`<${TreeItem} sel=${sel} setSel=${setSel} k=${`q:${si}:${ji}:${ki}`} icon=${(QTYPES.find(x=>x[0]===qq.type)||[])[1]} label=${T(qq.label)||T('(bez etykiety)')} depth=${2} err=${errNodes.has(`q:${si}:${ji}:${ki}`)}/>`)}
            <button class="ti-add" style=${{'--d':2}} onClick=${()=>setAddFor(addFor===`${si}:${ji}`?null:`${si}:${ji}`)}><${Icon} n="plus" s=${13}/>${T('Dodaj pytanie')}</button>
            ${addFor===`${si}:${ji}`&&html`<div class="qtype-pick" style=${{'--d':2}}>${QTYPES.map(([t,i,l,dsc])=>html`<button onClick=${()=>addQ(si,ji,t)}><${Icon} n=${i} s=${16}/><span><b>${T(l)}</b><small>${T(dsc)}</small></span></button>`)}</div>`}`)}
          ${isOpen&&html`<button class="ti-add" style=${{'--d':1}} onClick=${()=>{up(n=>n.steps[si].sections.push({id:'x'+Date.now()%1e4,title:T('Nowa sekcja'),layout:'list',questions:[]}));setSel(`sc:${si}:${s.sections.length}`)}}><${Icon} n="plus" s=${13}/>${T('Dodaj sekcję')}</button>`}</div>`})}
        <div class="tr-h">${T('Wyniki')}</div>
        <${TreeItem} sel=${sel} setSel=${setSel} k="viz" icon="chart" label=${T('Wizualizacja wyników')}/>
        <${TreeItem} sel=${sel} setSel=${setSel} k="logic" icon="code" label=${T('Logika obliczeń')} err=${errNodes.has('logic')} sub=${d.calc?d.calc.file:'brak pliku'}/>
        <${TreeItem} sel=${sel} setSel=${setSel} k="msg" icon="alert" label=${T('Komunikaty walidacji')}/>
        <${TreeItem} sel=${sel} setSel=${setSel} k="status" icon="sliders" label=${T('Status i wersja')}/>
      </aside>

      <section class="ed-props" aria-label=${T('Właściwości')}>
        ${kind==='intro'&&html`<${IntroProps} d=${d} up=${up}/>`}
        ${kind==='metrics'&&html`<div class="pp"><div class="pp-h"><span class="eyebrow">${T('Formularz')}</span><h3>${T('Dane metryczne')}</h3><p class="muted small">${T('Formularz wypełniany przed wpisaniem kodu. Wiek liczony jest automatycznie z dat (lata;miesiące) i walidowany względem norm {r}.',{r:ageRange(d)})}</p></div>
          ${d.metrics.map((ms,si)=>html`<div class="pp-card"><div class="pp-row"><input class="in" value=${ms.title} onInput=${e=>up(n=>n.metrics[si].title=e.target.value)} aria-label=${T('Nazwa sekcji')}/></div>
            <ul class="mini-list">${ms.fields.map((f,fi)=>html`<li><button class="link" onClick=${()=>setSel(`mf:${si}:${fi}`)}><${Icon} n=${(QTYPES.find(x=>x[0]===f.type)||[])[1]} s=${14}/>${f.label}</button>${f.required&&html`<span class="tag">${T('wymagane')}</span>`}</li>`)}</ul>
            <button class="btn sm subtle" onClick=${()=>{up(n=>n.metrics[si].fields.push(newQ('select','m_'+Math.random().toString(36).slice(2,6))));setSel(`mf:${si}:${ms.fields.length}`)}}><${Icon} n="plus" s=${14}/>${T('Dodaj pole')}</button></div>`)}</div>`}
        ${kind==='mf'&&mf&&html`<${QProps} d=${d} q=${mf} path=${n=>n.metrics[sIdx].fields[jIdx]} up=${up} metric onDelete=${()=>{up(n=>n.metrics[sIdx].fields.splice(jIdx,1));setSel('metrics')}}/>`}
        ${kind==='st'&&step&&html`<${StepProps} d=${d} si=${sIdx} up=${up} setSel=${setSel} mv=${mv}/>`}
        ${kind==='sc'&&sec&&html`<${SecProps} d=${d} si=${sIdx} ji=${jIdx} up=${up} setSel=${setSel} onAdd=${()=>setAddFor(`${sIdx}:${jIdx}`)}/>`}
        ${kind==='q'&&q&&html`<${QProps} d=${d} q=${q} path=${n=>n.steps[sIdx].sections[jIdx].questions[kIdx]} up=${up} pos=${[sIdx,jIdx,kIdx]}
          onMove=${dl=>{let ok;up(n=>{ok=mv(n.steps[sIdx].sections[jIdx].questions,kIdx,dl)});if(ok!==false)setSel(`q:${sIdx}:${jIdx}:${kIdx+dl}`)}}
          onDup=${()=>{up(n=>{const c2=clone(q);c2.id=q.id+'_k';c2.label=q.label+' (kopia)';n.steps[sIdx].sections[jIdx].questions.splice(kIdx+1,0,c2)});setSel(`q:${sIdx}:${jIdx}:${kIdx+1}`)}}
          onDelete=${()=>{up(n=>n.steps[sIdx].sections[jIdx].questions.splice(kIdx,1));setSel(`sc:${sIdx}:${jIdx}`)}}/>`}
        ${kind==='viz'&&html`<${VizProps} d=${d} up=${up} reseed=${()=>setSeed(s=>s+1)}/>`}
        ${kind==='logic'&&html`<${LogicProps} d=${d} up=${up}/>`}
        ${kind==='msg'&&html`<${MsgProps} d=${d} up=${up}/>`}
        ${kind==='status'&&html`<${StatusProps} d=${d} up=${up} errs=${errs}/>`}
      </section>

      <section class="ed-pv" aria-label=${T('Podgląd na żywo')}>
        <div class="pv-h"><span class="live"><i></i>${T('Podgląd na żywo')}</span><span class="sp"></span>
          ${d.variants.length>1&&html`<select class="in sm" value=${pvV} onChange=${e=>setPvV(e.target.value)} aria-label=${T('Wersja w podglądzie')}>${d.variants.map(v=>html`<option value=${v.id}>${v.name}</option>`)}</select>`}
          <${Seg} size="sm" value=${dev} onChange=${setDev} options=${[{v:'desktop',l:'',i:'desktop'},{v:'mobile',l:'',i:'phone'}]}/></div>
        <div class=${cx('pv-stage',dev)} ref=${pvRef}><div class=${cx('pv-dev',dev)}><div class="swd pv-swd">${preview()}</div></div></div>
      </section>
    </div>
    ${confirmLeave&&html`<${Modal} title=${T('Masz niezapisane zmiany')} onClose=${()=>setConfirmLeave(false)} foot=${html`<button class="btn ghost" onClick=${()=>{setConfirmLeave(false);onBack()}}>${T('Odrzuć zmiany')}</button><button class="btn primary" onClick=${()=>{save();setConfirmLeave(false);onBack()}}>${T('Zapisz i wyjdź')}</button>`}><p>${T('Zapisz zmiany w „{n}”, zanim wrócisz do listy narzędzi.',{n:d.name})}</p><//>`}
  </div>`}

function TreeItem({sel,setSel,k,icon,label,depth=0,count,actions,err,sub}){return html`<div class=${cx('ti',sel===k&&'on',err&&'has-err')} style=${{'--d':depth}}><button class="ti-b" onClick=${()=>setSel(k)}><${Icon} n=${icon} s=${15}/><span class="ti-t"><span class="ti-l">${label}</span>${sub&&html`<span class="ti-s">${sub}</span>`}</span>${count!=null&&html`<span class="ti-c mono">${count}</span>`}${err&&html`<span class="ti-e" title=${T('Błąd walidacji')}></span>`}</button>${actions&&html`<span class="ti-a">${actions}</span>`}</div>`}
/* --- property panels --- */
function PF({label,children,hint,id}){return html`<div class="pf"><label class="qf-l" for=${id}>${label}</label>${children}${hint&&html`<span class="small muted">${hint}</span>`}</div>`}
function OptEditor({options,onChange,kind}){
  return html`<div class="opt-ed">${options.map((o,i)=>html`<div class="opt-r" key=${i}>
    <input class="in sm mono w-xs" value=${o.v} onInput=${e=>{const n=clone(options);n[i].v=e.target.value;onChange(n)}} aria-label=${T('Wartość')}/>
    <input class="in sm" value=${o.l} onInput=${e=>{const n=clone(options);n[i].l=e.target.value;onChange(n)}} aria-label=${T('Etykieta')}/>
    ${kind==='check'&&html`<select class="in sm w-sm" value=${o.other?'other':o.none?'none':''} onChange=${e=>{const n=clone(options);delete n[i].other;delete n[i].none;if(e.target.value)n[i][e.target.value]=true;onChange(n)}} aria-label=${T('Zachowanie')}><option value="">${T('zwykła')}</option><option value="other">${T('„Inne” + pole')}</option><option value="none">${T('„Brak” — blokuje')}</option></select>`}
    <button class="icon-btn xs" onClick=${()=>{const n=clone(options);n.splice(i,1);onChange(n)}} aria-label=${T('Usuń')}><${Icon} n="x" s=${14}/></button></div>`)}
    <button class="btn sm subtle" onClick=${()=>onChange([...options,{v:String.fromCharCode(97+options.length),l:T('Nowa odpowiedź')}])}><${Icon} n="plus" s=${14}/>${T('Dodaj odpowiedź')}</button></div>`}

function IntroProps({d,up}){return html`<div class="pp"><div class="pp-h"><span class="eyebrow">${T('Ekran startowy')}</span><h3>${T('Informacje wstępne')}</h3></div>
  <div class="pp-2"><${PF} label=${T('Kod')} id="p-code"><input id="p-code" class="in mono" value=${d.code} onInput=${e=>up(n=>n.code=e.target.value)}/><//><${PF} label=${T('Kategoria')} id="p-cat"><select id="p-cat" class="in" value=${d.cat} onChange=${e=>up(n=>n.cat=e.target.value)}>${CATS.slice(1).map(c=>html`<option>${c}</option>`)}</select><//></div>
  <${PF} label=${T('Nazwa')} id="p-name"><input id="p-name" class="in" value=${d.name} onInput=${e=>up(n=>n.name=e.target.value)}/><//>
  <${PF} label=${T('Pełna nazwa')} id="p-full"><input id="p-full" class="in" value=${d.full} onInput=${e=>up(n=>n.full=e.target.value)}/><//>
  <${PF} label=${T('Opis dla diagnosty')} id="p-desc" hint=${T('Może zawierać linki do materiałów.')}><textarea id="p-desc" class="in" rows="4" value=${d.desc} onInput=${e=>up(n=>n.desc=e.target.value)}></textarea><//>
  <div class="pp-2"><${PF} label=${T('Wiek od (lata;mies.)')}><div class="age-in"><input class="in mono" value=${d.age[0]} onInput=${e=>up(n=>n.age[0]=+e.target.value||0)} aria-label=${T('lata od')}/><span>;</span><input class="in mono" value=${d.age[1]} onInput=${e=>up(n=>n.age[1]=Math.min(11,+e.target.value||0))} aria-label=${T('miesiące od')}/></div><//>
    <${PF} label=${T('Wiek do (lata;mies.)')}><div class="age-in"><input class="in mono" value=${d.age[2]} onInput=${e=>up(n=>n.age[2]=+e.target.value||0)} aria-label=${T('lata do')}/><span>;</span><input class="in mono" value=${d.age[3]} onInput=${e=>up(n=>n.age[3]=Math.min(11,+e.target.value||0))} aria-label=${T('miesiące do')}/></div><//></div>
  <${PF} label=${T('Czas badania')} id="p-min"><input id="p-min" class="in" value=${d.minutes} onInput=${e=>up(n=>n.minutes=e.target.value)}/><//>
  <${PF} label=${T('Wersje (ścieżki) badania')} hint=${T('Pola można wyszarzać w wybranych wersjach — w ustawieniach pytania.')}><div class="opt-ed">${d.variants.map((v,i)=>html`<div class="opt-r"><input class="in sm mono w-xs" value=${v.id} disabled/><input class="in sm" value=${v.name} onInput=${e=>up(n=>n.variants[i].name=e.target.value)}/>${d.variants.length>1&&html`<button class="icon-btn xs" onClick=${()=>up(n=>n.variants.splice(i,1))} aria-label=${T('Usuń wersję')}><${Icon} n="x" s=${14}/></button>`}</div>`)}
    <button class="btn sm subtle" onClick=${()=>up(n=>n.variants.push({id:'v'+(n.variants.length+1),name:T('Nowa wersja')}))}><${Icon} n="plus" s=${14}/>${T('Dodaj wersję')}</button></div><//>
  <${PF} label=${T('Czego potrzebuje diagnosta')}><${OptEditor} options=${d.needs.map((x,i)=>({v:String(i+1),l:x}))} onChange=${o=>up(n=>n.needs=o.map(x=>x.l))}/><//>
  <${PF} label=${T('Podpowiedź na karcie narzędzia')} id="p-tip"><textarea id="p-tip" class="in" rows="2" value=${d.tooltip} onInput=${e=>up(n=>n.tooltip=e.target.value)}></textarea><//></div>`}

function StepProps({d,si,up,setSel,mv}){const s=d.steps[si];
  return html`<div class="pp"><div class="pp-h row"><div><span class="eyebrow">${T('Ekran {a} z {b}',{a:si+1,b:d.steps.length})}</span><h3>${T('Krok')}</h3></div><span class="sp"></span>
    <button class="icon-btn sm" disabled=${si===0} onClick=${()=>{up(n=>mv(n.steps,si,-1));setSel('st:'+(si-1))}} aria-label=${T('Przesuń wyżej')}><${Icon} n="chevU"/></button><button class="icon-btn sm" disabled=${si===d.steps.length-1} onClick=${()=>{up(n=>mv(n.steps,si,1));setSel('st:'+(si+1))}} aria-label=${T('Przesuń niżej')}><${Icon} n="chevD"/></button>
    <button class="icon-btn sm danger" onClick=${()=>{up(n=>n.steps.splice(si,1));setSel('intro')}} aria-label=${T('Usuń krok')}><${Icon} n="trash"/></button></div>
  <${PF} label=${T('Tytuł kroku')} id="p-st"><input id="p-st" class="in" value=${s.title} onInput=${e=>up(n=>n.steps[si].title=e.target.value)}/><//>
  <${PF} label=${T('Tekst instrukcji (1 na ekran)')} id="p-ins"><textarea id="p-ins" class="in" rows="3" value=${s.instruction} onInput=${e=>up(n=>n.steps[si].instruction=e.target.value)}></textarea><//>
  <${PF} label=${T('Obraz (1 na ekran)')}><${ImagePick} id=${'st-img'+si} value=${s.image} onChange=${v=>up(n=>n.steps[si].image=v)}/><//>
  <div class="pp-card"><${Toggle} id="p-skip" on=${s.skippable} onChange=${v=>up(n=>n.steps[si].skippable=v)} label=${T('Diagnosta może pominąć ten krok')}/><p class="small muted">${T('Pominięte kroki są oznaczane w raporcie, a ich wskaźniki nie są liczone.')}</p></div>
  <div class="pp-card"><b class="small">${T('Sekcje w kroku')}</b><ul class="mini-list">${s.sections.map((sc,ji)=>html`<li><button class="link" onClick=${()=>setSel(`sc:${si}:${ji}`)}>${sc.title}</button><span class="tag">${T(LAYOUTS.find(l=>l.v===sc.layout).l)} · ${sc.questions.length}</span></li>`)}</ul></div></div>`}

function SecProps({d,si,ji,up,setSel,onAdd}){const sc=d.steps[si].sections[ji];

  ${!metric&&html`<${PF} label=${T('Wskaźnik w wyniku')} id="p-ind" hint=${T('Do którego wskaźnika plik logiki dolicza tę odpowiedź.')}><select id="p-ind" class="in" value=${ind?ind.id:''} onChange=${e=>up(n=>{n.indicators.forEach(i=>i.from=i.from.filter(f=>f!==q.id));const t=n.indicators.find(i=>i.id===e.target.value);if(t)t.from.push(q.id)})}><option value="">${T('— nie wlicza się —')}</option>${d.indicators.map(i=>html`<option value=${i.id}>${i.name}</option>`)}</select><//>`}</div>`}

function LogicProps({d,up}){const [run,setRun]=useState(null);const [parsed,setParsed]=useState(null);
  const onFile=f=>{if(!f)return;if(!/\.(js|mjs|json)$/i.test(f.name)){toast(T('Wybierz plik .js z algorytmem obliczeń.'),'warn');return}
    const r=new FileReader();r.onload=()=>{const txt=String(r.result);const has=/calculate\s*\(|function\s+calculate|calculate\s*[:=]/.test(txt);setParsed({name:f.name,size:(f.size/1024).toFixed(1).replace('.',',')+' KB',has,lines:txt.split('\n').length});
      if(has)up(n=>n.calc={file:f.name,size:(f.size/1024).toFixed(1).replace('.',',')+' KB',date:TODAY,tests:null});else toast(T('Nie znaleziono funkcji calculate(). Sprawdź plik.'),'warn')};r.readAsText(f)};
  const runTests=()=>{setRun('run');setTimeout(()=>{const n=d.steps.length*2+2;setRun(`${n}/${n}`);up(x=>x.calc&&(x.calc.tests=`${n}/${n}`))},1400)};
  return html`<div class="pp"><div class="pp-h"><span class="eyebrow">${T('Wynik')}</span><h3>${T('Logika obliczeń')}</h3><p class="muted small">${T('Algorytm (steny, ilorazy, centyle) dostarczany jest jako plik. Jeden plik = jedno narzędzie. Edytor formuł jest poza zakresem.')}</p></div>
  ${d.calc?html`<div class="file-c"><span class="fi"><${Icon} n="code" s=${20}/></span><div><b class="mono">${d.calc.file}</b><span class="small muted">${d.calc.size} · wgrano ${fmtShort(d.calc.date)}</span></div><span class="sp"></span>${d.calc.tests&&html`<span class="pill p-ok"><i></i>${T('Testy')} ${d.calc.tests}</span>`}</div>`:html`<div class="warn-box sm danger"><${Icon} n="alert" s=${18}/><p>${T('Brak pliku logiki. Narzędzia nie można aktywować.')}</p></div>`}
  <label class="drop" for="calc-f"><${Icon} n="upload" s=${22}/><span><b>${d.calc?T('Zastąp plik'):T('Wgraj plik')} logiki</b><small>${T('.js z funkcją')} <span class="mono">${T('calculate(answers, metrics)')}</span></small></span></label><input id="calc-f" type="file" accept=".js,.mjs,.json" class="sr" onChange=${e=>onFile(e.target.files[0])}/>
  ${parsed&&html`<div class=${cx('parse',parsed.has?'ok':'bad')}><${Icon} n=${parsed.has?'check':'alert'} s=${16}/><span>${parsed.name} · ${parsed.lines} ${T('linii')} · ${parsed.has?'znaleziono calculate()':'brak calculate()'}</span></div>`}
  <div class="sig"><span class="eyebrow">${T('Kontrakt pliku')}</span><pre class="mono">calculate(answers, metrics) → {\n  indicators: { ${d.indicators.slice(0,3).map(i=>i.id).join(', ')}${d.indicators.length>3?', …':''} },\n  composites: { ${(d.composites||[]).map(c=>c.id).join(', ')||'—'} }\n}</pre></div>
  <button class="btn sm" onClick=${runTests} disabled=${!d.calc||run==='run'}><${Icon} n="play" s=${14}/>${run==='run'?T('Uruchamianie testów referencyjnych…'):T('Uruchom testy referencyjne')}</button>
  ${run&&run!=='run'&&html`<div class="parse ok"><${Icon} n="check" s=${16}/><span>${T('{r} przypadków zgodnych z wynikami wzorcowymi',{r:run})}</span></div>`}
  <div class="pf"><span class="qf-l">${T('Wskaźniki i przypisane pola')}</span><div class="ind-l">${d.indicators.map((ind,i)=>html`<div class="ind-r"><input class="in sm" value=${ind.name} onInput=${e=>up(n=>n.indicators[i].name=e.target.value)} aria-label=${T('Nazwa wskaźnika')}/><span class="ind-f">${ind.from.map(f=>html`<span class="mono tag">${f}</span>`)}</span></div>`)}</div>
    <button class="btn sm subtle" onClick=${()=>up(n=>n.indicators.push({id:'W'+(n.indicators.length+1),name:T('Nowy wskaźnik'),from:[]}))}><${Icon} n="plus" s=${14}/>${T('Dodaj wskaźnik')}</button><//>
  <div class="pp-card"><b class="small">${T('Historia pliku')}</b><ul class="hist"><li><span class="mono">${d.calc?d.calc.file:'—'}</span><span class="muted small">${T('bieżąca')}</span></li><li><span class="mono">${d.id}_calc_prev.js</span><span class="muted small">2026-03-02</span></li></ul></div></div>`}

    <div class="svc-tools">${tools.map(x=>{const n=S.sessions.filter(s=>s.tool===x.id).length;return html`<button class=${cx('svc-t',x.id===tid&&'on')} onClick=${()=>{setTid(x.id);setSelIds(new Set());setExp(null)}}><span class="mono">${x.code}</span><b>${n}</b></button>`})}</div>
    <div class="toolbar"><label class="search sm"><${Icon} n="search" s=${16}/><input id="svc-q" placeholder=${T('Szukaj: kod, ID badania, diagnosta')} value=${q} onInput=${e=>setQ(e.target.value)}/></label>
      <label class="date-f"><span class="small muted">${T('Od')}</span><input type="date" class="in sm" value=${from} onInput=${e=>setFrom(e.target.value)}/></label><label class="date-f"><span class="small muted">${T('Do')}</span><input type="date" class="in sm" value=${to} onInput=${e=>setTo(e.target.value)}/></label>
      <span class="sp"></span><button class="btn sm" onClick=${()=>setEx({rows:S.sessions.filter(s=>s.tool===tid),all:true})}><${Icon} n="download" s=${15}/>${T('Cała baza')} ${t.code}</button></div>
    <div class="tbl-wrap card"><table class="tbl svc"><thead><tr><th class="cb"><input type="checkbox" aria-label=${T('Zaznacz wszystkie')} checked=${all} onChange=${e=>setSelIds(e.target.checked?new Set(rows.map(r=>r.id)):new Set())}/></th><th>${T('ID')}</th><th>${T('Data')}</th><th>${T('Kod')}</th><th class="n">${T('Wiek')}</th><th>${T('Płeć')}</th><th>${T('Wersja')}</th><th>${T('Wynik główny')}</th><th>${T('Diagnosta')}</th><th></th></tr></thead>
      <tbody>${rows.map(s=>{const r=computeResults(t,s);const m=r.main;const v=t.variants.find(x=>x.id===s.variant);const isE=exp===s.id;
        return html`<tr class=${cx(selIds.has(s.id)&&'sel',isE&&'exp')}><td class="cb"><input type="checkbox" checked=${selIds.has(s.id)} onChange=${()=>tog(s.id)} aria-label=${T('Zaznacz ')+s.id}/></td><td class="mono">${s.id}</td><td class="mono">${fmtShort(s.date)} <span class="muted">${s.time}</span></td><td class="mono">${s.code}</td><td class="n mono">${fmtAge(r.age)}</td><td>${s.metrics.sex==='k'?'K':'M'}</td><td class="small">${v?v.name.replace(T('Wersja '),''):'—'}</td>
          <td>${m&&m.value!=null?html`<span class=${'zt z-'+m.tone}>${m.type==='risk'?T('Ryzyko ')+m.display:m.value+' '+m.unit}</span>`:'—'}</td><td class="small muted">${s.diag}</td><td><button class="icon-btn xs" onClick=${()=>setExp(isE?null:s.id)} aria-label=${T('Szczegóły')} aria-expanded=${isE}><${Icon} n=${isE?'chevU':'chevD'} s=${15}/></button></td></tr>
          ${isE&&html`<tr class="exp-row"><td colspan="10"><div class="exp-g"><div><span class="eyebrow">${T('Odpowiedzi')}</span><dl class="ans">${allQuestions(t).map(({q:qq})=>{const a=s.answers[qq.id];const lab=v=>{const o=(qq.options||[]).find(x=>x.v===v);return o?o.l:v};return html`<div><dt>${qq.label}</dt><dd class=${qq.options?'':'mono'}>${a==null?'—':Array.isArray(a)?a.map(lab).join(', '):lab(a)}</dd></div>`})}</dl></div>
            <div><span class="eyebrow">${T('Wskaźniki')}</span><dl class="ans">${r.rows.map(x=>html`<div><dt>${x.name}</dt><dd class="mono">${x.score??'—'} <span class="muted">(${x.raw??'—'}/${x.max??'—'})</span></dd></div>`)}</dl></div></div></td></tr>`}`})}
      ${!rows.length&&html`<tr><td colspan="10" class="empty-td">${T('Brak badań w wybranym zakresie dat. Zmień filtry, aby zobaczyć wyniki.')}</td></tr>`}</tbody></table></div>
    ${selIds.size>0&&html`<div class="sel-bar"><b>${T('Zaznaczono')} ${selIds.size}</b><button class="link" onClick=${()=>setSelIds(new Set())}>${T('Wyczyść')}</button><span class="sp"></span><button class="btn primary" onClick=${()=>setEx({rows:S.sessions.filter(s=>selIds.has(s.id))})}><${Icon} n="download" s=${16}/>${T('Pobierz zaznaczone (.xlsx)')}</button></div>`}
    ${ex&&html`<${ExportModal} t=${t} rows=${ex.rows} all=${ex.all} onClose=${()=>setEx(null)}/>`}
  </div>`}

function ExportModal({t,rows,all,onClose}){const qs=allQuestions(t).map(x=>x.q);const fname=`SWD_${t.code.replace(/[^A-Za-z0-9]+/g,'')}_${all?'baza':'wybrane'}_${TODAY}.xlsx`;
  const head=['ID',T('Data'),T('Godzina'),T('Kod'),T('Płeć'),T('Data ur.'),T('Wiek'),T('Wersja'),...qs.map(q=>q.id),...t.indicators.map(i=>i.id+'_sten')];
  const data=rows.map(s=>{const r=computeResults(t,s);return [s.id,s.date,s.time,s.code,s.metrics.sex,s.metrics.dob,fmtAge(r.age),s.variant,...qs.map(q=>{const a=s.answers[q.id];return a==null?'':Array.isArray(a)?a.join('|'):a}),...r.rows.map(x=>x.score??'')]});
  return html`<${Modal} wide title=${T('Eksport do Excela')} sub=${T('{f} · {a} rekordów · {b} kolumn',{f:fname,a:rows.length,b:head.length})} onClose=${onClose} foot=${html`<span class="small muted">${T('W podglądzie prototypu pobieranie plików jest wyłączone.')}</span><span class="sp"></span><button class="btn" onClick=${()=>copyText([head,...data].map(r=>r.join(';')).join('\n'))}><${Icon} n="copy" s=${16}/>${T('Kopiuj jako CSV')}</button><button class="btn primary" onClick=${()=>toast(T('W docelowym systemie zapisze się plik ')+fname,'info')}><${Icon} n="download" s=${16}/>${T('Pobierz .xlsx')}</button>`}>
    <div class="xls"><div class="xls-bar"><span class="xls-ic">${T('X')}</span><span class="mono small">${fname}</span><span class="sp"></span><span class="small muted">${T('Arkusz: Wyniki')}</span></div>
    <div class="tbl-wrap"><table class="tbl xls-t"><thead><tr><th class="rn"></th>${head.map((h,i)=>html`<th><span class="col-l">${String.fromCharCode(65+(i%26))}${i>=26?Math.floor(i/26):''}</span>${h}</th>`)}</tr></thead><tbody>${data.slice(0,30).map((r,i)=>html`<tr><td class="rn">${i+2}</td>${r.map(c=>html`<td class="mono">${c}</td>`)}</tr>`)}</tbody></table></div></div><//>`}

function CodesView({onGen}){const S=useStore();const [tid,setTid]=useState('all');const [st,setSt]=useState('all');const [q,setQ]=useState('');const [lim,setLim]=useState(60);
  const rows=S.codes.filter(c=>tid==='all'||c.tool===tid).filter(c=>st==='all'||(st==='free'?!c.used:!!c.used)).filter(c=>!q||c.code.includes(q.toUpperCase())||c.batch.includes(q.toUpperCase()));
  return html`<div class="adm-pad"><div class="adm-h"><div><span class="eyebrow">${T('Serwis')}</span><h1>${T('Kody dostępu')}</h1><p class="muted">${T('Rejestr wygenerowanych kodów i ich wykorzystania. Każdy wykorzystany kod jest zapisywany w bazie.')}</p></div><button class="btn primary" onClick=${()=>onGen(tid==='all'?null:tid)}><${Icon} n="key"/>${T('Generuj kody')}</button></div>
    <div class="toolbar"><label class="search sm"><${Icon} n="search" s=${16}/><input id="codes-q" placeholder=${T('Szukaj kodu lub partii')} value=${q} onInput=${e=>setQ(e.target.value)}/></label>
      <select class="in sm w-md" value=${tid} onChange=${e=>setTid(e.target.value)} aria-label=${T('Narzędzie')}><option value="all">${T('Wszystkie narzędzia')}</option>${S.tools.map(t=>html`<option value=${t.id}>${t.code}</option>`)}</select>
      <${Seg} size="sm" value=${st} onChange=${setSt} options=${[{v:'all',l:T('Wszystkie')},{v:'free',l:T('Wolne')},{v:'used',l:T('Wykorzystane')}]}/><span class="sp"></span><span class="small muted mono">${rows.length} ${T('kodów')}</span></div>
    <div class="tbl-wrap card"><table class="tbl"><thead><tr><th>${T('Kod')}</th><th>${T('Narzędzie')}</th><th>${T('Partia')}</th><th>${T('Wygenerowano')}</th><th>${T('Wykorzystano')}</th><th>${T('Status')}</th><th></th></tr></thead><tbody>
      ${rows.slice(0,lim).map(c=>html`<tr><td class="mono"><b>${c.code}</b></td><td class="mono small">${toolById(c.tool)?.code||'—'}</td><td class="mono small">${c.batch}</td><td class="mono small">${fmtShort(c.created)}</td><td class="mono small">${c.used||'—'}</td><td>${c.batch==='DEMO'?html`<span class="pill p-info"><i></i>${T('Demo')}</span>`:c.used?html`<span class="pill p-muted"><i></i>${T('Wykorzystany')}</span>`:html`<span class="pill p-ok"><i></i>${T('Wolny')}</span>`}</td><td><button class="icon-btn xs" onClick=${()=>copyText(c.code)} aria-label=${T('Kopiuj kod')}><${Icon} n="copy" s=${14}/></button></td></tr>`)}</tbody></table></div>
    ${rows.length>lim&&html`<button class="btn sm more-b" onClick=${()=>setLim(lim+100)}>${T('Pokaż więcej')} (${rows.length-lim})</button>`}</div>`}

/* ============ Mobile showcase ============ */
const JUMPS=[
  {k:'list',l:'Lista narzędzi',d:'Wyszukiwarka, kategorie, karty',i:'grid',p:null},
  {k:'intro',l:'Wstęp narzędzia',d:'SB5 · wybór wersji, start',i:'file',p:{view:'intro',toolId:'sb5'}},
  {k:'metrics',l:'Dane metryczne',d:'Daty, wiek 12;2, walidacja',i:'user',p:{view:'study',toolId:'dk1012',phase:'metrics',fill:false}},
  {k:'test',l:'Odpowiedzi 1:4',d:'FSDS · macierz na dotyk',i:'matrix',p:{view:'study',toolId:'fsds',phase:'test',fill:true}},
  {k:'result',l:'Wynik i wykres',d:'Dyskalkulia · profil poziomy',i:'chart',p:{view:'study',toolId:'dk1012',phase:'result',fill:true}}];

function MobileShowcase({go}){useLang();
  const [orient,setOrient]=useState('portrait');const [jump,setJump]=useState(JUMPS[0]);const [n,setN]=useState(0);
  const W=orient==='portrait'?390:844,H=orient==='portrait'?844:390;
  const stageRef=useRef();const sw=useWidth(stageRef);
  const [vh,setVh]=useState(window.innerHeight);useEffect(()=>{const f=()=>setVh(window.innerHeight);window.addEventListener('resize',f);return()=>window.removeEventListener('resize',f)},[]);
  useEffect(()=>{const sc=stageRef.current&&stageRef.current.querySelector('.ph-scroll');if(sc)sc.scrollTop=0},[n]);
  const fw=W+28,fh=H+28;const s=Math.min(1,(sw||fw)/fw,orient==='portrait'?Math.max(.55,(vh-150)/fh):1);
  return html`<div class="mob">
    <header class="mob-h"><div class="wrap mob-h-in"><button class="brand sm" onClick=${()=>go('portal')}><${Mark} s=${22}/><b>SWD</b><span class="muted small">${T('Wersja mobilna')}</span></button><span class="sp"></span>
      <${SkinSwitch}/><${LangSwitch}/><button class="btn sm ghost" onClick=${()=>go('portal')}><${Icon} n="desktop" s=${15}/><span>${T('Portal')}</span></button><button class="btn sm ghost" onClick=${()=>go('admin')}><${Icon} n="sliders" s=${15}/><span>${T('Panel administratora')}</span></button></div></header>
    <div class="wrap mob-g">
      <section class="mob-side">
        <span class="kicker"><span class="swd-badge">iPhone 12</span>${T('Responsywność')}</span><h1>${T('Cały portal diagnosty na telefonie')}</h1>
        <p class="lead">${T('Ten sam portal co na komputerze, w ekranie 390 × 844 pt. Wszystko jest klikalne: wybierz narzędzie, wpisz dane i kod, zobacz wynik.')}</p>
        <div class="mob-ctl"><span class="qf-l">${T('Orientacja')}</span><${Seg} value=${orient} onChange=${o=>{setOrient(o);setN(x=>x+1)}} options=${[{v:'portrait',l:T('Pionowo'),i:'phone'},{v:'landscape',l:T('Poziomo'),i:'desktop'}]}/></div>
        <div class="mob-ctl"><span class="qf-l">${T('Przejdź do ekranu')}</span><div class="jumps">${JUMPS.map((j,i)=>html`<button class=${cx('jump',jump.k===j.k&&'on')} onClick=${()=>{setJump(j);setN(x=>x+1)}}><span class="j-n mono">0${i+1}</span><${Icon} n=${j.i} s=${18}/><span><b>${T(j.l)}</b><small>${T(j.d)}</small></span></button>`)}</div></div>
        <div class="ac-list"><span class="eyebrow">${T('Kryteria z wizji i zakresu')}</span><ul>
          ${[['Wszystkie funkcje diagnosty na telefonie','wybór narzędzia, dane, odpowiedzi, wynik, PDF, e-mail'],['Pionowo i poziomo','układ dopasowuje się do szerokości ekranu'],['Zoom i pinch','powiększanie strony nie jest blokowane'],['Cele dotykowe ≥ 44 px','przyciski, opcje macierzy i pola liczbowe'],['Wykres dla wąskich ekranów','profil przechodzi w układ poziomy'],['Render < 3 s','lekki interfejs, bez ciężkich zasobów']].map(([a,b])=>html`<li><span class="ck-i"><${Icon} n="check" s=${14}/></span><span><b>${T(a)}</b><small>${T(b)}</small></span></li>`)}</ul></div>
      </section>
      <section class="mob-stage" ref=${stageRef}>
        <div class="stage-glow"><${Scene} mode="net" cls="stage-scene"/></div>
        <div class="ph-box" style=${{width:fw*s+'px',height:fh*s+'px'}}>
          <div class=${cx('phone',orient)} style=${{width:fw+'px',height:fh+'px',transform:`scale(${s})`}}>
            <span class="ph-btn b1"></span><span class="ph-btn b2"></span><span class="ph-btn b3"></span>
            <div class="ph-screen" style=${{width:W+'px',height:H+'px'}}>
              <div class="ph-status"><span class="ph-time">9:41</span><span class="ph-notch"></span><span class="ph-icons"><${Icon} n="signal" s=${15}/><${Icon} n="wifi" s=${15}/><${Icon} n="battery" s=${20}/></span></div>
              <div class="ph-url"><span><${Icon} n="lock" s=${11}/>pracowniatestow.pl/swd</span></div>
              <div class="ph-scroll"><${Portal} key=${n} preset=${jump.p} embedded go=${go}/></div>
              <div class="ph-home"></div>
            </div></div></div>
        <p class="small muted ph-cap">${orient==='portrait'?'390 × 844':'844 × 390'} · ${T('skala')} ${Math.round(s*100)}% · ${T('przewijaj wewnątrz ekranu')}</p>
      </section></div></div>`}

/* ============ App shell ============ */
function areaFromHash(){const h=(location.hash||'').replace('#','');return h==='mobile'||h==='admin'?h:'portal'}
function App(){useLang();const [area,setArea]=useState(areaFromHash);
  useEffect(()=>{const f=()=>setArea(areaFromHash());window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  const go=a=>{setArea(a);try{history.replaceState(null,'',a==='portal'?location.pathname+location.search:'#'+a)}catch(e){}window.scrollTo(0,0)};
  return html`<${Fragment}>${area==='portal'&&html`<${Portal} go=${go}/>`}${area==='mobile'&&html`<${MobileShowcase} go=${go}/>`}${area==='admin'&&html`<${Admin} go=${go}/>`}<${Toasts}/><//>`}
render(html`<${App}/>`,document.getElementById('app'));

</script>
</body></html>
